<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Foundations: Think, Ask, Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@700&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1D1A16;
  --slate:#1B2430;
  --page:#FFF8EC;
  --card:#FFFFFF;
  --rule:#EADFCB;
  --muted:#6B6357;
  --marigold:#FFB703;
  --marigold-deep:#E08A00;
  --chilli:#E23A2E;
  --peacock:#0F7B6C;
  --ultramarine:#2743C4;
  --violet:#6D28D9;
  --lilac:#F1ECFF;
  --mint:#E3F6EF;
  --blush:#FDE9E7;
  --amberbg:#FFF1D2;
  --sky:#E6F3FF;
  --m1:#C2410C;--m2:#A16207;--m3:#047857;--m4:#6D28D9;--m5:#B91C1C;--m6:#0369A1;--m7:#1B2430;
  --disp:"Baloo 2","Trebuchet MS",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad:clamp(16px,4.5vw,48px);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--slate);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
@media (max-width:600px){body{font-size:16.5px}}

/* ---------- shell ---------- */
#rail{position:fixed;top:0;left:0;height:5px;width:0;background:var(--marigold);z-index:60;transition:width .35s cubic-bezier(.4,0,.2,1)}
#stage{height:100dvh;display:flex;flex-direction:column}
#deck{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.slide{display:none;min-height:100%;padding:calc(var(--pad) + 8px) var(--pad) 48px;background:var(--page);
  background-image:radial-gradient(#EADFCB 1.2px,transparent 1.6px);background-size:24px 24px}
.slide.on{display:block;animation:in .3s ease-out}
.slide.cover.on,.slide.divider.on{display:flex;align-items:center}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:760px;margin:0 auto}
.wide .wrap{max-width:940px}

/* ---------- nav bar ---------- */
#bar{display:flex;align-items:center;gap:10px;background:var(--slate);color:#fff;padding:9px max(10px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom)) 10px;z-index:50}
#sawaal-status{font-size:11px;line-height:1.3;color:#9FB0C6;max-width:26%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sawaal-status[data-state="saved"]{color:#7FD8C5}#sawaal-status[data-state="offline"],#sawaal-status[data-state="error"]{color:var(--marigold)}
#sawaal-account{background:#1F2B3B;border-radius:12px;padding:14px 16px;margin:0 0 22px;color:#fff}
@media (max-width:600px){#sawaal-status{display:none}}
#bar button{font-family:var(--body);font-size:16px;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
#prev{background:#33415A;color:#fff}
#next{background:var(--marigold);color:#231B08;flex:1;max-width:260px;margin-left:auto}
#next:disabled{opacity:.4;cursor:not-allowed}
#next.warn{background:var(--chilli);color:#fff}
#menuBtn{background:#33415A;color:#fff;padding:12px 14px}
#pos{font-size:13px;color:#9FB0C6;font-variant-numeric:tabular-nums;min-width:54px;text-align:center}
#modLabel{font-size:13px;color:#9FB0C6;max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){#modLabel{display:none}}


/* ThinkHumanly logo */
.th-logo{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;padding:3px 7px;height:44px;flex:none}
.th-logo img{height:36px;width:auto;display:block}
.th-by{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 14px 8px 12px;margin-top:22px;color:#1D1A16;font-size:13px;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.th-by img{height:52px;width:auto;display:block}
@media (max-width:420px){#bar{gap:6px}#pos{min-width:38px;font-size:12px}#bar button{padding:12px 12px}#next{min-width:96px;white-space:nowrap}.th-logo{padding:3px 5px}.th-logo img{height:32px}}

/* ---------- contents overlay ---------- */
#toc{position:fixed;inset:0;background:rgba(12,17,24,.97);color:#fff;z-index:70;display:none;overflow-y:auto;padding:24px}
#toc.on{display:block}
#toc h2{font-family:var(--disp);font-size:28px;margin:0 0 4px;color:#fff}
#toc p{color:#9FB0C6;margin:0 0 20px;font-size:14px}
.tocItem{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #33415A;color:#fff;padding:12px 2px;font-size:16px;font-family:var(--body);cursor:pointer}
.tocItem span{color:#8FA3BC;font-size:13px;display:block}
.tocItem:hover{color:var(--marigold)}
#tocClose{margin-top:22px;background:var(--marigold);color:#231B08;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-family:var(--body);font-size:15px;cursor:pointer}

/* ---------- typography ---------- */
h1{font-family:var(--disp);font-weight:800;font-size:clamp(36px,7vw,58px);line-height:1.02;letter-spacing:-.01em;margin:0 0 12px}
h2{font-family:var(--disp);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 12px}
h3{font-family:var(--disp);font-weight:700;font-size:22px;line-height:1.2;margin:22px 0 8px}
p{margin:0 0 14px;max-width:62ch}
.lead{font-size:clamp(18px,2.4vw,21px);color:#3C352C;max-width:56ch}
.tag{display:inline-block;background:var(--amberbg);border:1.5px solid #F2D48A;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;color:#7A5200;margin-bottom:12px}
.mins{color:var(--muted);font-size:13px;font-weight:500}
strong{font-weight:700}
.small{font-size:15px;color:var(--muted)}
ul,ol{margin:0 0 16px;padding-left:22px;max-width:62ch}
li{margin-bottom:8px}
a{color:var(--ultramarine)}

/* ---------- mascot ---------- */
.mascot{width:72px;height:72px;flex:none}
.say{display:flex;gap:12px;align-items:flex-start;margin:0 0 18px}
.say .bubble{position:relative;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px 15px;font-size:16.5px;line-height:1.5;flex:1;box-shadow:3px 3px 0 var(--ink)}
.say .bubble::before{content:"";position:absolute;left:-11px;top:22px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
.say .bubble::after{content:"";position:absolute;left:-8px;top:24px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.say .who{display:block;font-family:var(--disp);font-weight:800;font-size:14px;color:var(--marigold-deep);margin-bottom:2px;letter-spacing:.02em}

/* ---------- cover ---------- */
.cover{background:var(--slate);background-image:radial-gradient(circle at 12% 18%,rgba(255,183,3,.22),transparent 42%),radial-gradient(circle at 88% 80%,rgba(39,67,196,.3),transparent 46%);color:#fff}
.coverwrap{display:grid;gap:24px;align-items:center;width:100%}
@media (min-width:760px){.coverwrap{grid-template-columns:1.3fr 1fr}}
.cover h1{font-size:clamp(52px,12vw,96px);color:#fff;margin-bottom:6px}
.cover .tagline{color:#D6E0EC;font-size:clamp(19px,2.6vw,23px);max-width:30ch;line-height:1.45}
.scripts{font-size:clamp(26px,6vw,40px);color:var(--marigold);margin-bottom:10px;line-height:1.9}
.scripts .ur{font-family:"Noto Nastaliq Urdu",serif}
.scripts .dv{font-family:"Noto Sans Devanagari",serif}
.cover .meta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.cover .meta span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:6px 13px;font-size:14px;color:#E6EDF5}
.covart{position:relative;display:flex;justify-content:center;align-items:center;min-height:220px}
.covart .mascot-xl{width:min(240px,60vw);height:auto;filter:drop-shadow(0 12px 22px rgba(0,0,0,.35));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.float{position:absolute;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:#fff;color:var(--slate);font-family:var(--disp);font-weight:800;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.f1{top:8%;left:12%;background:var(--marigold)}.f2{bottom:10%;right:10%;background:#7FD8C5}.f3{top:16%;right:14%}

/* ---------- dividers (mission openers) ---------- */
.divider{color:#fff;background-image:radial-gradient(rgba(255,255,255,.12) 1.4px,transparent 1.8px);background-size:26px 26px}
.divider.m1{background-color:var(--m1)}.divider.m2{background-color:var(--m2)}.divider.m3{background-color:var(--m3)}.divider.m4{background-color:var(--m4)}
.divider.m5{background-color:var(--m5)}.divider.m6{background-color:var(--m6)}.divider.m7,.divider.done{background-color:var(--m7)}
.divider .wrap{width:100%}
.divgrid{display:grid;gap:22px;align-items:center}
@media (min-width:760px){.divgrid{grid-template-columns:1.2fr 1fr}}
.divider h1{color:#fff}
.divider .num{display:inline-grid;place-items:center;width:78px;height:78px;border-radius:50%;background:#fff;color:var(--ink);font-family:var(--disp);font-weight:800;font-size:44px;line-height:1;margin-bottom:10px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.divider .mtag{display:block;font-family:var(--disp);font-weight:700;font-size:18px;color:rgba(255,255,255,.85);margin-bottom:2px}
.divider p{color:rgba(255,255,255,.92);font-size:19px;max-width:44ch}
.divider .kit{margin-top:18px;display:inline-block;background:rgba(0,0,0,.2);border-radius:99px;padding:7px 15px;color:#fff;font-size:14.5px;font-weight:600}
.art{background:#fff;border-radius:24px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.art svg{display:block;width:100%;height:auto;max-height:280px}

/* ---------- cards & panels ---------- */
.panel{background:var(--card);border:2px solid var(--rule);border-radius:var(--r);padding:20px;margin:0 0 18px}
.panel.tight{padding:15px}
.grid{display:grid;gap:12px;margin-bottom:18px}
@media (min-width:680px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.mini{background:var(--card);border:2px solid var(--rule);border-radius:var(--r);padding:16px}
.mini h4{margin:4px 0 4px;font-family:var(--disp);font-size:20px;font-weight:800;line-height:1.2}
.mini p{font-size:15.5px;margin:0;color:#4A4238}
.mini .strip{margin-top:10px;font-weight:700;font-size:15px}
.ico{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--amberbg);font-size:28px;line-height:1}
.ico.lg{width:64px;height:64px;font-size:34px}
.ico.r{background:var(--blush)}.ico.g{background:var(--mint)}.ico.b{background:var(--sky)}.ico.v{background:var(--lilac)}
.mini.top-r{border-top:6px solid var(--chilli)}.mini.top-a{border-top:6px solid var(--marigold-deep)}.mini.top-g{border-top:6px solid var(--peacock)}.mini.top-b{border-top:6px solid var(--ultramarine)}
.row2{display:flex;gap:12px;align-items:flex-start}
.row2 .ico{flex:none}

/* numbered steps */
.steps{display:grid;gap:10px;margin-bottom:18px}
.step{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.step .n{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--m3);color:#fff;font-family:var(--disp);font-weight:800;font-size:22px}
.step b{display:block;font-family:var(--disp);font-size:19px;line-height:1.2}
.step span{font-size:15px;color:#4A4238}

/* chat bubbles */
.chat{background:#fff;border:2px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:14px}
.chat .who-tag{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:2px 10px;margin-bottom:8px}
.who-tag.p{background:var(--blush);color:#9B1C14}.who-tag.c{background:var(--amberbg);color:#7A5200}.who-tag.d{background:var(--mint);color:#0B5E52}
.bub{border-radius:14px;padding:10px 13px;margin-bottom:8px;font-size:15.5px;line-height:1.45;max-width:90%}
.bub:last-child{margin-bottom:0}
.you{background:var(--lilac);border:1px solid #DCD4FA}
.ai{background:#F4F2EE;border:1px solid var(--rule);margin-left:auto}
.bub b{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--muted);margin-bottom:2px;font-weight:700;text-transform:uppercase}

/* prompt boxes */
.plabel{font-weight:700;font-size:14px;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.prompt{background:var(--slate);color:#EAF0F7;border-radius:14px;padding:15px 16px;padding-right:72px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;position:relative;margin-bottom:14px}
.prompt.weak{background:#F4EEEA;color:#5A483E;border:2px dashed #D9C6BA}
.copy{position:absolute;top:9px;right:9px;background:#3B4A60;color:#fff;border:0;border-radius:8px;font-size:12.5px;font-weight:700;padding:7px 10px;cursor:pointer;font-family:var(--body)}
.prompt.weak .copy{background:#C9B6A8;color:#3A2E26}
.copy.done{background:var(--peacock);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 16px}
.pill{font-size:13.5px;font-weight:600;border-radius:99px;padding:4px 11px;color:#231B08}
.pill.R{background:#FFD66B}.pill.O{background:#FFB703}.pill.T{background:#F4A259}.pill.I{background:#EE8F66}

/* boxes (like the textbook's) */
.box{border-radius:var(--r);padding:14px 16px;margin-bottom:18px;font-size:16px;border:2px solid transparent}
.box .lbl{display:block;font-family:var(--disp);font-weight:800;font-size:17px;margin-bottom:3px}
.box p:last-child{margin-bottom:0}
.box.think{background:var(--lilac);border-color:#D6CCF7}.box.think .lbl{color:var(--violet)}
.box.snap{background:var(--mint);border-color:#B9E3D5}.box.snap .lbl{color:var(--peacock)}
.box.try{background:var(--sky);border-color:#BFDDF7}.box.try .lbl{color:var(--ultramarine)}
.box.warn{background:var(--blush);border-color:#F5C2BC}.box.warn .lbl{color:#B91C1C}
.box.gold{background:var(--amberbg);border-color:#F2D48A}.box.gold .lbl{color:#8A5A00}

/* guess bars (how AI writes) */
.guess{background:#fff;border:2px solid var(--rule);border-radius:var(--r);padding:16px;margin-bottom:16px}
.guess .gq{font-family:var(--disp);font-weight:800;font-size:22px;margin-bottom:10px}
.gb{display:grid;grid-template-columns:88px 1fr 46px;gap:10px;align-items:center;font-size:15px;margin-bottom:7px}
.gb .t{height:16px;background:#F3EFE6;border-radius:99px;overflow:hidden}
.gb .t i{display:block;height:100%;width:var(--w);background:var(--ultramarine);border-radius:99px}
.gb.low .t i{background:var(--chilli)}
.gb b{text-align:right;font-variant-numeric:tabular-nums}

/* two columns ok / not ok */
.vs2{display:grid;gap:10px;margin-bottom:18px}
@media (min-width:640px){.vs2{grid-template-columns:1fr 1fr}}
.vs2 .col{border-radius:var(--r);padding:14px 16px}
.vs2 .col h4{margin:0 0 8px;font-family:var(--disp);font-size:20px}
.vs2 .col.ok{background:var(--mint);border:2px solid #B9E3D5}
.vs2 .col.no{background:var(--blush);border:2px solid #F5C2BC}
.vs2 ul{margin:0;padding-left:20px;font-size:15.5px}
.vs2 li{margin-bottom:7px}

/* 3-step flow */
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-bottom:18px}
.flow .f{flex:1;min-width:150px;background:#fff;border:2px solid var(--rule);border-radius:var(--r);padding:14px;text-align:center}
.flow .f .ico{margin-bottom:6px}
.flow .f b{display:block;font-family:var(--disp);font-size:19px}
.flow .arrow{align-self:center;font-size:24px;color:var(--muted)}
@media (max-width:560px){.flow .arrow{display:none}}

/* ---------- activity ---------- */
.act{border:3px solid var(--ink);border-radius:20px;background:#fff;padding:0;margin:0 0 20px;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
.act>header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.act>header h3{margin:0;color:#fff;font-size:20px;flex:1}
.act>header .mins{color:var(--marigold);font-weight:700}
.actbody{padding:18px 16px}
.qcard{border-bottom:2px dashed var(--rule);padding-bottom:18px;margin-bottom:18px}
.qcard:last-of-type{border-bottom:0;margin-bottom:6px;padding-bottom:0}
.qcard .qt{font-weight:600;margin-bottom:10px;display:block;font-size:17px}
.qcard .qt .qn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--marigold);color:#231B08;font-family:var(--disp);font-weight:800;font-size:16px;margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;font-family:var(--body);font-size:16px;background:#fff;border:2px solid var(--rule);border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;color:var(--ink)}
.opts.row .opt{flex:1;min-width:100px;text-align:center;font-weight:700}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:3px solid var(--ultramarine);outline-offset:2px}
.opt.picked{border-width:2px;background:var(--slate);border-color:var(--slate);color:#fff}
.opt.right{background:var(--mint);border-color:var(--peacock);color:var(--ink)}
.opt.wrong{background:var(--blush);border-color:var(--chilli);color:var(--ink)}
@media (max-width:480px){.opts.row .opt{padding:10px 6px;font-size:15px;min-width:0}}
.opt.picked.right::after{content:"  ✓";font-weight:800;color:var(--peacock)}
.opt.picked.wrong::after{content:"  ✗";font-weight:800;color:var(--chilli)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.45}
.fb{margin-top:10px;font-size:15.5px;line-height:1.5;padding:12px 14px;border-radius:12px;display:none}
.fb.on{display:block;animation:in .25s ease-out}
.fb.ok{background:var(--mint);border-left:5px solid var(--peacock)}
.fb.no{background:var(--blush);border-left:5px solid var(--chilli)}
.fb b{display:block;margin-bottom:3px}

/* traffic pills */
.opt.green{border-color:#9CCFC4}.opt.green.picked{background:var(--mint);color:var(--ink)}
.opt.amber{border-color:#E8C97A}.opt.amber.picked{background:var(--amberbg);color:var(--ink)}
.opt.red{border-color:#EFA9A3}.opt.red.picked{background:var(--blush);color:var(--ink)}
.legend3{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.legend3 span{border-radius:99px;padding:5px 12px;font-size:14.5px;font-weight:600}
.legend3 .g{background:var(--mint)}.legend3 .a{background:var(--amberbg)}.legend3 .r{background:var(--blush)}

/* ---------- ROTI builder ---------- */
.roti{display:grid;gap:9px;margin-bottom:16px}
.layer{display:grid;grid-template-columns:52px 1fr;align-items:stretch;border-radius:16px;overflow:hidden;border:2px solid var(--rule)}
.layer .lk{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;color:#231B08}
.layer .lk small{font-family:var(--body);font-size:9.5px;font-weight:700;margin-top:3px;letter-spacing:.02em}
.layer textarea{border:0;border-radius:0;padding:12px 13px;font-family:var(--body);font-size:16px;resize:vertical;min-height:64px;background:#fff;color:var(--ink);line-height:1.45}
.layer textarea:focus{outline:2px solid var(--ultramarine);outline-offset:-2px}
.layer:nth-child(1) .lk{background:#FFD66B}
.layer:nth-child(2) .lk{background:#FFB703}
.layer:nth-child(3) .lk{background:#F4A259}
.layer:nth-child(4) .lk{background:#EE8F66}
.meter{height:12px;background:var(--rule);border-radius:99px;overflow:hidden;margin:6px 0 6px}
.meter i{display:block;height:100%;width:0;background:var(--chilli);transition:width .3s,background .3s}
.mrow{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;color:var(--muted);margin-bottom:12px}
.mrow b{color:var(--ink)}

/* fake-fact hunt */
.doc{background:#fff;border:2px solid var(--rule);border-radius:var(--r);padding:8px;margin-bottom:14px;counter-reset:sus}
.sus{display:block;cursor:pointer;padding:11px 12px 11px 12px;margin:6px 0;border-radius:12px;border:2px solid var(--rule);font-size:16px;line-height:1.5;transition:background .15s,border-color .15s}
.sus::before{counter-increment:sus;content:counter(sus);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:800;color:#5A5044;background:#F0EBE0;margin-right:8px;vertical-align:1px}
.sus:hover{background:#FFF7E0}
.sus.flag{border-color:var(--marigold-deep)}
.sus.flag::after{content:" 🚩";}
.sus.hit{background:#FFD9D5;border-color:var(--chilli)}.sus.hit::before{background:var(--chilli);color:#fff}
.sus.miss{background:#E6EFEA;border-color:var(--peacock)}.sus.miss::before{background:var(--peacock);color:#fff}
.sus.shown{background:#FFE9A8;border-color:var(--marigold-deep)}.sus.shown::before{background:var(--marigold-deep);color:#fff}
.sus.hit::after,.sus.miss::after,.sus.shown::after{content:""}
.huntfb{font-size:15.5px}
.huntfb div{padding:10px 13px;border-radius:12px;margin-bottom:8px;background:#F7F4EE;border-left:5px solid var(--rule)}
.huntfb div.bad{background:var(--blush);border-color:var(--chilli)}
.huntfb div.fine{background:var(--mint);border-color:var(--peacock)}
.hunthint{font-size:14.5px;color:var(--muted);margin:-4px 0 12px}

/* inputs */
input[type=text],textarea,select{font-family:var(--body);font-size:16px;width:100%;border:2px solid var(--rule);border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--ultramarine);outline-offset:-1px;border-color:var(--ultramarine)}
textarea{resize:vertical;line-height:1.5}
label.fl{display:block;font-weight:700;font-size:16px;margin:16px 0 6px}
label.fl span{font-weight:400;color:var(--muted)}
.btn{font-family:var(--body);font-size:16px;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--ink);color:#fff}
.btn.alt{background:var(--marigold);color:#231B08}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn:focus-visible{outline:3px solid var(--ultramarine);outline-offset:2px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#F3EFE6;border:2px solid var(--rule);border-radius:99px;padding:8px 13px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--body);color:#4A4238;text-align:left}
.chip:hover{background:var(--amberbg);border-color:var(--marigold)}

/* check-ins */
.me{border:3px dashed #B8AD99;border-radius:20px;background:#FFFDF8;padding:18px;margin:10px 0 6px}
.meq.needs-answer,.qcard.needs-answer,.actbody.needs-answer{outline:3px solid var(--chilli);outline-offset:5px;border-radius:12px;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.me>h3{margin:0 0 3px;font-size:22px}
.me .sub{font-size:14.5px;color:var(--muted);margin-bottom:14px}
.likert{display:flex;gap:6px;margin-top:8px}
.likert button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--body);font-weight:700;font-size:13px;border:2px solid var(--rule);background:#fff;border-radius:12px;padding:8px 0 6px;cursor:pointer;color:var(--muted)}
.likert button .face{font-size:26px;line-height:1.1;filter:grayscale(.6);opacity:.75;transition:filter .15s,opacity .15s,transform .15s}
.likert button:hover .face{filter:none;opacity:1}
.likert button.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.likert button.on .face{filter:none;opacity:1;transform:scale(1.15)}
.lends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}
.meq{margin-bottom:20px}
.meq>span.qt{display:block;font-weight:700;font-size:16.5px;margin-bottom:2px}
.meq .optl{font-weight:400;color:var(--muted);font-size:14px}
.saved{font-size:14px;color:var(--peacock);font-weight:700;display:none}
.saved.on{display:block}

/* badges */
.badge{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF6DA,#FFE39A);border:2px solid #E8B437;border-radius:20px;padding:14px 16px;margin-bottom:16px}
.medal{flex:none;display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:#fff;font-size:36px;line-height:1;box-shadow:0 0 0 5px var(--marigold),0 5px 0 5px #C98A00}
.badge b{display:block;font-family:var(--disp);font-size:21px;line-height:1.2}
.badge span{font-size:15px;color:#5A4A20}
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:16px;margin:22px 0}
.wall div{text-align:center;color:#fff;font-weight:700;font-size:14px}
.wall .medal{margin:0 auto 10px;font-size:36px}

/* timer */
.timer{display:inline-flex;align-items:center;gap:9px;background:var(--slate);color:#fff;border-radius:99px;padding:6px 8px 6px 15px;font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;margin-bottom:14px}
.timer button{background:var(--marigold);color:#231B08;border:0;border-radius:99px;font-family:var(--body);font-weight:700;font-size:13px;padding:8px 13px;cursor:pointer}
.timer.done{background:var(--chilli)}

/* score stamp */
.stamp{display:none;border:4px solid var(--peacock);color:var(--peacock);background:#fff;font-family:var(--disp);font-weight:800;font-size:22px;padding:6px 16px;border-radius:12px;transform:rotate(-3deg);margin:14px 0 4px}
.stamp.on{display:inline-block;animation:pop .35s ease-out}
@keyframes pop{from{transform:rotate(-3deg) scale(.7);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}

/* passage */
.passage{background:#FFFDF6;border:2px solid var(--rule);border-left:6px solid var(--marigold);border-radius:var(--r);padding:16px 18px;font-size:16.5px;line-height:1.65;margin-bottom:10px}

table{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:16px;background:#fff}
th,td{border:1px solid var(--rule);padding:9px 11px;text-align:left;vertical-align:top}
th{background:#F3EFE6;font-weight:700}

.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* ===== AI Foundations additions ===== */
.mascot.sm{width:56px;height:56px}
.say.mini .bubble{font-size:15.5px}
.lead.tight{margin-bottom:10px}
/* tap-to-build ROTI */
.rotiwrap{display:grid;gap:14px;margin-bottom:12px}
@media (min-width:760px){.rotiwrap{grid-template-columns:1fr 250px;align-items:start}}
.lpick{border:2px solid var(--rule);border-radius:16px;padding:10px 12px;margin-bottom:10px;background:#fff}
.lpick h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-family:var(--disp);font-size:18px}
.lpick h4 .lk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:800;color:#231B08}
.lpick[data-l="r"] .lk{background:#FFD66B}.lpick[data-l="o"] .lk{background:#FFB703}.lpick[data-l="t"] .lk{background:#F4A259}.lpick[data-l="i"] .lk{background:#EE8F66}
.lpick h4 small{font-family:var(--body);font-weight:500;font-size:13.5px;color:var(--muted)}
.pk{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:#FBF8F2;border:2px solid var(--rule);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer;color:var(--ink)}
.pk:hover{border-color:var(--ink)}
.pk.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.lpick.needs-answer{outline:3px solid var(--chilli);outline-offset:4px;animation:shake .3s}
.stack{background:#fff;border:2px solid var(--rule);border-radius:16px;padding:10px;text-align:center;position:sticky;top:10px}
.stack svg{width:100%;max-width:240px;height:auto}
.stack .rl{transform:translateY(-140px);opacity:0;transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.stack .rl.on{transform:none;opacity:1}
.stack .lbl{font-size:13px;color:var(--muted);margin-top:4px}
/* guided ladder */
.climbwrap{display:grid;gap:14px}
@media (min-width:760px){.climbwrap{grid-template-columns:150px 1fr}}
.climb{background:#fff;border:2px solid var(--rule);border-radius:16px;padding:8px;align-self:start;position:sticky;top:10px}
.climb svg{display:block;width:100%;max-width:150px;margin:0 auto;height:auto}
.climb #climber{transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
@media (max-width:759px){.climb{display:none}}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.topics .pk{width:auto;display:inline-block;margin:0}
.lstep{border:2px solid var(--rule);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#fff;transition:opacity .3s}
.lstep.locked{opacity:.45;pointer-events:none}
.lstep h4{margin:0 0 6px;font-family:var(--disp);font-size:19px;display:flex;gap:8px;align-items:center}
.lstep h4 .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--m3);color:#fff;font-size:16px}
.lstep.done h4 .n{background:var(--peacock)}
.lstep .you{background:var(--lilac);border:1px solid #DCD4FA;border-radius:12px;padding:9px 12px;font-size:15px;margin-bottom:8px}
.lstep .you b{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.picks3{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.climb-done{display:none;font-weight:700;color:var(--peacock);margin-top:6px}
.climb-done.on{display:block;animation:fxRise .35s ease-out}
/* traffic light per question */
.tl{display:inline-flex;gap:4px;background:var(--slate);border-radius:99px;padding:4px 6px;vertical-align:middle;margin-left:6px}
.tl i{width:12px;height:12px;border-radius:50%;background:#3A4A5E;transition:background .25s,box-shadow .25s}
.qcard[data-lit="Red"] .tl .r{background:#E23A2E;box-shadow:0 0 10px #E23A2E}
.qcard[data-lit="Amber"] .tl .a{background:#FFB703;box-shadow:0 0 10px #FFB703}
.qcard[data-lit="Green"] .tl .g{background:#2BA84A;box-shadow:0 0 10px #2BA84A}
/* gating highlight for the new interactive pieces */
.needs-answer{outline:3px solid var(--chilli)!important;outline-offset:4px;border-radius:12px;animation:shake .3s}
/* mission divider art comes alive when the screen opens */
.slide.on .art svg{animation:artPop .6s cubic-bezier(.2,1.3,.4,1) both}
.slide.on .art.drive-in svg{animation:driveIn 1.1s cubic-bezier(.2,.9,.3,1.05) both}
@keyframes driveIn{0%{transform:translateX(-120%) rotate(-2deg)}70%{transform:translateX(4%) rotate(1deg)}85%{transform:translateX(-1%)}100%{transform:none}}
.slide.on .art.roti-drop svg{animation:none}
.slide.on .art.roti-drop svg>g:first-of-type ellipse{animation:rotiDrop .55s cubic-bezier(.3,1.5,.5,1) both}
.slide.on .art.roti-drop svg>g:first-of-type ellipse:nth-child(2){animation-delay:.18s}
.slide.on .art.roti-drop svg>g:first-of-type ellipse:nth-child(3){animation-delay:.36s}
.slide.on .art.roti-drop svg>g:first-of-type ellipse:nth-child(4){animation-delay:.54s}
.slide.on .art.roti-drop svg>g:nth-of-type(2){animation:artFade .4s .8s both}
@keyframes rotiDrop{0%{transform:translateY(-160px);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.slide.on .art.climb-up svg>use{animation:climbUp 1.6s cubic-bezier(.4,1.2,.5,1) both}
@keyframes climbUp{0%{transform:translateY(90px)}30%{transform:translateY(60px)}55%{transform:translateY(30px)}80%,100%{transform:none}}
.slide.on .art.stamp-in svg>g:last-of-type{animation:artFade .35s .7s both}
.slide.on .art.tl-blink svg circle{animation:tlBlink 2.4s ease-in-out both}
.slide.on .art.tl-blink svg circle:nth-of-type(2){animation-delay:.4s}
.slide.on .art.tl-blink svg circle:nth-of-type(3){animation-delay:.8s}
@keyframes tlBlink{0%{opacity:.25}15%{opacity:1}35%{opacity:.35}55%,100%{opacity:1}}
.slide.on .art.ring-spin svg{animation:ringSpin 1.1s cubic-bezier(.2,1,.3,1) both}
@keyframes ringSpin{0%{transform:rotate(-200deg) scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes artPop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes artFade{from{opacity:0}to{opacity:1}}
/* swap trick */
.swapmsg{background:#fff;border:2px dashed #D9C6BA;border-radius:14px;padding:12px 14px;font-size:16px;margin-bottom:10px}
.swapmsg .nm{transition:all .4s;border-radius:4px}
.swapmsg.swapped .nm{text-decoration:line-through;color:var(--chilli);background:var(--blush)}
/* me first */
.mefirst textarea{font-size:17px}
.charcount{font-size:13px;color:var(--muted);margin:4px 0 10px}
/* quiz inside ladder */
.qmini .opt{font-size:15px}

      if(!ans||ans.a===undefined||ans.a===null||ans.a==="")missing.push(box);
    }
  });
  /* "Ask the AI" demo buttons: watch the answer before moving on */
  $$("[data-ask]",slide).forEach(function(b){if(!b.dataset.asked)missing.push(b);});
  /* ROTI builder */
  if(slide.querySelector("#rotiPicks")){
    $$(".lpick",slide).forEach(function(lp){if(!lp.querySelector(".pk.on"))missing.push(lp);});
    if(!missing.length&&!STATE.answers.roti_prompt)missing.push($("#r_ask"));
  }
  /* ladder */
  if(slide.querySelector("#ladSteps")&&!STATE.answers.ladder_done){
    if(!LAD.topic)missing.push($("#ladTopics"));
    else{var nx=$("#ladSteps .lstep:not(.done)");if(nx)missing.push(nx);}
  }
  /* guesser */
  if(guesserEl&&slide.contains(guesserEl)&&!guesserEl.dataset.done&&!STATE.answers.guesser_seen)missing.push(guesserEl);

  if(slide.querySelector("#mf_own")&&!STATE.answers.asked_mefirst){

  var hd=slide.querySelector("#huntdoc");
  if(hd&&!hd.dataset.done)missing.push(hd.closest(".actbody")||hd);
  return missing;
}

function applyActivityAnswer(card,val,isRestore){
  var act=card.closest(".act").dataset.act;
  var opts=$$(".opt",card),opt=null;
  opts.forEach(function(o){if(o.dataset.v===val)opt=o;});
  if(!opt||card.dataset.done)return;
  card.dataset.done="1";
  if(card.querySelector(".tl"))card.dataset.lit=val;   /* light up the traffic light */
  var correct=opt.hasAttribute("data-correct");
  opts.forEach(function(o){
    o.disabled=true;
    if(o===opt)o.classList.add("picked",correct?"right":"wrong");
    else if(o.hasAttribute("data-correct"))o.classList.add("right");
    else o.classList.add("dim");
  });
  var fb=card.querySelector(".fb");
  fb.className="fb on "+(correct?"ok":"no");
  fb.innerHTML="<b>"+(correct?"🎉 Yes!":"🤔 Not quite.")+"</b>"+esc(opt.dataset.fb||"");
  if(!isRestore&&!correct)card.classList.add("fx-shake");
  if(!SCORES[act])SCORES[act]={right:0,total:0};
  SCORES[act].right+=correct?1:0;SCORES[act].total+=1;
  if(!isRestore)rec(act+"_"+card.dataset.q,modOf(opt),card.querySelector(".qt").textContent.replace(/^\d+/,"").trim().slice(0,140),opt.dataset.v,correct?1:0);
  var body=card.closest(".actbody");
  if($$(".qcard[data-done]",body).length===$$(".qcard",body).length){
    var st=body.querySelector(".stamp[data-stamp]");
    if(st){
      var s=SCORES[act];
      st.textContent=s.right+" out of "+s.total+(s.right===s.total?" 🌟 Perfect!":(s.right>=s.total*0.6?" 👍 Nice!":" 📖 Read the tips again"));

function rotiState(){
  var picked={},sum=0,count=0;
  $$("#rotiPicks .lpick").forEach(function(lp){

function rotiLevel(st){return st.sum>=7?"strong":(st.sum>=4?"mid":"weak");}

}

  huntDoc.dataset.done="1";
  var spans=$$(".sus",huntDoc),hits=0,bad=0,falseAlarm=0,html="",flagged=[];
  spans.forEach(function(s,n){
    var isBad=s.dataset.v==="bad",isFlag=s.classList.contains("flag");
    if(isFlag)flagged.push(n);
    s.classList.remove("flag");
    if(isBad){bad++;if(isFlag){hits++;s.classList.add("hit");}else{s.classList.add("shown");}}
    else if(isFlag){falseAlarm++;s.classList.add("miss");}
    var verdict=isBad?(isFlag?"🎯 You caught it! ":"😮 Missed. "):(s.dataset.v==="soft"?(isFlag?"👍 Good instinct. ":"Worth flagging too. "):(isFlag?"This one was actually fine. ":"✅ Correctly left alone. "));
    html+='<div class="'+(isBad?"bad":"fine")+'"><b>'+(n+1)+'. </b>'+verdict+esc(s.dataset.note)+'</div>';
    var sd=STAMP[s.dataset.v]||STAMP.fine,stamp=document.createElement("span");
    stamp.className="fx-stamp";stamp.textContent=sd[0];stamp.style.color=sd[1];
    if(!isRestore&&!FX.reduce)stamp.style.animationDelay=(n*0.15)+"s";
    else stamp.style.animation="none";
    s.appendChild(stamp);
  });
  huntFb.innerHTML=html;
  var st=$('.stamp[data-stamp="hunt"]');
  st.textContent=hits+" of "+bad+" fakes caught"+(falseAlarm?", "+falseAlarm+" false alarm"+(falseAlarm>1?"s":""):"")+(hits===bad?" 🌟":"");
  st.classList.add("on");
  if(hits<3){st.style.borderColor=st.style.color="#E23A2E";}
  if(!isRestore){
    rec("hunt_flags",modOf(huntDoc),"Sentences flagged in the fake-fact hunt",flagged);
    rec("hunt_score",modOf(huntDoc),"Fakes caught in the fake-fact hunt",hits+"/"+bad+" (false alarms: "+falseAlarm+")",hits);
    if(hits===bad&&!falseAlarm){var r=st.getBoundingClientRect();setTimeout(function(){FX.confetti({x:r.left+r.width/2,y:r.top,count:80});},900);}
  }
}
$("#hunt_check").addEventListener("click",function(){
  if(huntDoc.dataset.done||huntDoc.dataset.busy)return;
  if(!$$(".sus.flag",huntDoc).length){
    huntFb.innerHTML='<div>👆 Tap the sentences you think are fake first. Then press the button.</div>';
    return;
  }
  if(FX.reduce||FX.instant){huntEvaluate(false);return;}
  huntDoc.dataset.busy="1";huntDoc.classList.add("fx-scanning");
  setTimeout(function(){huntDoc.classList.remove("fx-scanning");delete huntDoc.dataset.busy;huntEvaluate(false);},1400);
});
function restoreHunt(){
  var f=STATE.answers.hunt_flags;
  if(!f||!Array.isArray(f.a))return;
  var spans=$$(".sus",huntDoc);
  f.a.forEach(function(n){if(spans[n])spans[n].classList.add("flag");});
  huntEvaluate(true);
}
$("#hunt_reset").addEventListener("click",function(){
  if(huntDoc.dataset.busy)return;
  delete huntDoc.dataset.done;huntFb.innerHTML="";
  var st=$('.stamp[data-stamp="hunt"]');st.classList.remove("on");st.style.borderColor=st.style.color="";
  $$(".sus",huntDoc).forEach(function(s){s.className="sus";$$(".fx-stamp",s).forEach(function(x){x.remove();});});
  rec("hunt_flags",modOf(huntDoc),"Sentences flagged in the fake-fact hunt",null);
});

/* ============ SWAP TRICK (privacy demo) ============ */
var swapBtn=$("#swapBtn");
swapBtn.addEventListener("click",function(){
  if(swapBtn.dataset.done)return;
  swapBtn.dataset.done="1";swapBtn.disabled=true;swapBtn.innerHTML="✓ Swapped";
  $("#swapmsg").classList.add("swapped");
  var out=$("#swapOut");
  FX.sleep(900).then(function(){
    out.classList.remove("hide");
    out.innerHTML='<b style="display:block;font-size:12px;letter-spacing:.06em;color:var(--peacock)">✅ SAFE VERSION</b><span></span>';
    return FX.type(out.querySelector("span"),"\"A classmate sent me a message that felt a bit mean, but maybe it was a joke. What could she have meant, and how could I ask her about it?\"");
  }).then(function(){
    var n=document.createElement("p");n.className="ai-note";n.style.marginTop="8px";
    n.textContent="Same problem, same help. But no names, no class and no screenshot of someone else's words.";
    out.parentNode.insertBefore(n,out.nextSibling);
  });
});

/* ============ ACTIVITY 7: ME FIRST ============ */
var mfOwn=$("#mf_own"),mfAsk=$("#mf_ask"),mfCount=$("#mf_count"),mfReply=$("#mf_reply"),mfCmp=$("#mf_cmp");
var MF_REPLY="Phones can keep you awake in a few ways. The bright screen tells your brain it's still daytime, so your body makes less of its sleep chemical. Exciting videos and games keep your mind busy when it should be slowing down. And notifications can wake you up, or make you want to check your phone \"just once more\".";
function mfUpdate(){
  if(mfAsk.dataset.asked)return;
  var n=mfOwn.value.trim().length;
  mfAsk.disabled=n<10;
  mfCount.textContent=n<10?"Write at least a few words to unlock the AI.":"✅ Unlocked! Tap the button when you're happy with your answer.";
}
mfOwn.addEventListener("input",mfUpdate);
function mfReveal(instant){
  if(mfAsk.dataset.asked)return;
  mfAsk.dataset.asked="1";mfAsk.disabled=true;mfAsk.innerHTML="✓ Shown";
  mfOwn.readOnly=true;
  mfCount.textContent="Your answer is locked in. Now compare.";
  say(mfReply,MF_REPLY,instant).then(function(){
    mfCmp.classList.remove("hide");
    if(!instant)setTimeout(function(){mfCmp.scrollIntoView({behavior:"smooth",block:"center"});},200);
  });
}
mfAsk.addEventListener("click",function(){
  if(mfOwn.value.trim().length<10)return;
  rec("mefirst_own",modOf(mfOwn),"Me first: why might a phone at night make it harder to sleep? (own answer)",mfOwn.value);
  rec("asked_mefirst",modOf(mfAsk),"Me first: wrote own answer, then looked at the AI's","yes");
  mfReveal(false);
});

/* ============ COPY ============ */
function copyText(txt,btn){
  function done(){
    if(!btn)return;var old=btn.textContent;btn.textContent="Copied ✓";btn.classList.add("done");
    setTimeout(function(){btn.textContent=old;btn.classList.remove("done");},1600);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,function(){fallback(txt);done();});
  }else{fallback(txt);done();}
}
function fallback(txt){
  var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(err){}document.body.removeChild(ta);
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-copy]");if(!b)return;
  var box=b.parentNode.cloneNode(true);
  var inner=box.querySelector("[data-copy]");if(inner)inner.remove();
  copyText(box.textContent.trim(),b);
});

/* ============ MY RULES ============ */
$('[data-fill="charter"]').addEventListener("click",function(e){
  var c=e.target.closest(".chip");if(!c)return;
  var inputs=$$(".charter-in");
  for(var i=0;i<inputs.length;i++){if(!inputs[i].value.trim()){inputs[i].value=c.textContent;inputs[i].dispatchEvent(new Event("input",{bubbles:true}));inputs[i].classList.add("fx-bounce");inputs[i].focus();return;}}
});

/* ============ FREE TEXT STORE ============ */
document.addEventListener("input",function(e){
  var el=e.target;if(!el.dataset||!el.dataset.store)return;
  if(el.id==="mf_own")return; /* saved when the AI answer is revealed */
  var lab=el.id?document.querySelector('label[for="'+el.id+'"]'):null;
  var q=lab?lab.textContent.trim().slice(0,140):(el.previousElementSibling&&el.previousElementSibling.tagName==="LABEL"?el.previousElementSibling.textContent.trim():el.dataset.store);
  rec(el.dataset.store,modOf(el),q,el.value);
});

/* ============ RESUME: put saved answers back on screen ============ */
function restoreMeqUI(){
  $$(".meq").forEach(function(box){
    var id=box.dataset.item,ans=STATE.answers[id];
    if(!ans)return;
    var buttons=$$("button[data-val]",box);
    if(buttons.length){
      buttons.forEach(function(b){
        if(String(b.dataset.val)===String(ans.a))b.classList.add(b.parentNode.classList.contains("likert")?"on":"picked");
      });
    }else{
      var ta=box.querySelector("textarea");
      if(ta)ta.value=ans.a==null?"":ans.a;
    }
  });
  $$(".me").forEach(function(host){
    var saved=host.querySelector(".saved");
    if(saved&&host.querySelector(".meq .on,.meq .picked"))saved.classList.add("on");
  });
}
function restoreStoredFields(){
  $$("[data-store]").forEach(function(el){
    var ans=STATE.answers[el.dataset.store];
    if(ans&&ans.a!=null)el.value=ans.a;
  });
  if(STATE.answers.code_name&&!pid.value){pid.value=STATE.answers.code_name.a||"";STATE.pid=pid.value;}
}
function restoreDemos(){
  Object.keys(STATE.answers).forEach(function(k){
    var m=/^asked_(.+)$/.exec(k);
    if(m&&m[1]!=="mefirst")askDemo(m[1],true);
  });
  if(STATE.answers.asked_mefirst)mfReveal(true);else mfUpdate();
}

/* ============ PLATFORM: open, restore, resume ============ */
function applyMode(state){
  var online=state.mode==="online"||state.mode==="offline";
  if(online&&state.student){
    STATE.pid=state.student.code;
    pid.value=state.student.code;
    pid.classList.add("hide");
    var lab=pid.parentNode.querySelector('label[for="pid"]');if(lab)lab.classList.add("hide");
    var hint=pid.parentNode.querySelector("p.small");if(hint)hint.classList.add("hide");
    $("#pidTitle").textContent="Your secret key 🔑";
    var ps=$("#pidSigned");ps.textContent=state.student.code;ps.classList.remove("hide");
    $("#saveNote").textContent="Saved online as you go. You can stop and carry on later, on any phone or computer.";
    $("#doneSaved").classList.remove("hide");
    $("#doneBack").classList.remove("hide");
  }
  if(state.mode==="local"){
    $("#saveNote").textContent="You're not signed in, so answers stay on this device only. Open the menu (☰) and choose Sign in to save.";
  }
}

slides[0].classList.add("on");
show(0);

Sawaal.start().then(function(state){
  RESTORING=true;FX.instant=true;
  try{
    Object.keys(state.answers).forEach(function(k){STATE.answers[k]=state.answers[k];});
    applyMode(state);
    restoreMeqUI();
    restoreStoredFields();
    restoreActivitiesUI();
    restoreRoti();
    restoreLadder();
    restoreHunt();
    restoreDemos();
  }catch(err){if(window.console)console.error(err);}
  finally{RESTORING=false;FX.instant=false;}
  show(state.completed?0:(state.screen||0));  /* finished students start from the top to reread */
  READY=true;
});

window.addEventListener("beforeunload",function(e){
  if(Sawaal.mode==="local"&&Object.keys(STATE.answers).length>3){e.preventDefault();e.returnValue="";}
});
})();
</script>
