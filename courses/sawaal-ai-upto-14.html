<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sawaal AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@700&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1D1A16;
  --slate:#1B2430;
  --page:#FFF8EC;
  --card:#FFFFFF;
  --rule:#EADFCB;
  --muted:#6B6357;
  --marigold:#FFB703;
  --marigold-deep:#E08A00;
  --chilli:#E23A2E;
  --peacock:#0F7B6C;
  --ultramarine:#2743C4;
  --violet:#6D28D9;
  --lilac:#F1ECFF;
  --mint:#E3F6EF;
  --blush:#FDE9E7;
  --amberbg:#FFF1D2;
  --sky:#E6F3FF;
  --m1:#C2410C;--m2:#A16207;--m3:#047857;--m4:#6D28D9;--m5:#B91C1C;--m6:#0369A1;--m7:#1B2430;
  --disp:"Baloo 2","Trebuchet MS",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad:clamp(16px,4.5vw,48px);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--slate);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
@media (max-width:600px){body{font-size:16.5px}}

/* ---------- shell ---------- */
#rail{position:fixed;top:0;left:0;height:5px;width:0;background:var(--marigold);z-index:60;transition:width .35s cubic-bezier(.4,0,.2,1)}
#stage{height:100dvh;display:flex;flex-direction:column}
#deck{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.slide{display:none;min-height:100%;padding:calc(var(--pad) + 8px) var(--pad) 48px;background:var(--page);
  background-image:radial-gradient(#EADFCB 1.2px,transparent 1.6px);background-size:24px 24px}
.slide.on{display:block;animation:in .3s ease-out}
.slide.cover.on,.slide.divider.on{display:flex;align-items:center}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:760px;margin:0 auto}
.wide .wrap{max-width:940px}

/* ---------- nav bar ---------- */
#bar{display:flex;align-items:center;gap:10px;background:var(--slate);color:#fff;padding:9px max(10px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom)) 10px;z-index:50}
#sawaal-status{font-size:11px;line-height:1.3;color:#9FB0C6;max-width:26%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sawaal-status[data-state="saved"]{color:#7FD8C5}#sawaal-status[data-state="offline"],#sawaal-status[data-state="error"]{color:var(--marigold)}
#sawaal-account{background:#1F2B3B;border-radius:12px;padding:14px 16px;margin:0 0 22px;color:#fff}
@media (max-width:600px){#sawaal-status{display:none}}
#bar button{font-family:var(--body);font-size:16px;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
#prev{background:#33415A;color:#fff}
#next{background:var(--marigold);color:#231B08;flex:1;max-width:260px;margin-left:auto}
#next:disabled{opacity:.4;cursor:not-allowed}
#next.warn{background:var(--chilli);color:#fff}
#menuBtn{background:#33415A;color:#fff;padding:12px 14px}
#pos{font-size:13px;color:#9FB0C6;font-variant-numeric:tabular-nums;min-width:54px;text-align:center}
#modLabel{font-size:13px;color:#9FB0C6;max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){#modLabel{display:none}}


/* ThinkHumanly logo */
.th-logo{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;padding:3px 7px;height:44px;flex:none}
.th-logo img{height:36px;width:auto;display:block}
.th-by{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 14px 8px 12px;margin-top:22px;color:#1D1A16;font-size:13px;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.th-by img{height:52px;width:auto;display:block}
@media (max-width:420px){#bar{gap:6px}#pos{min-width:38px;font-size:12px}#bar button{padding:12px 12px}#next{min-width:96px;white-space:nowrap}.th-logo{padding:3px 5px}.th-logo img{height:32px}}

/* ---------- contents overlay ---------- */
#toc{position:fixed;inset:0;background:rgba(12,17,24,.97);color:#fff;z-index:70;display:none;overflow-y:auto;padding:24px}
#toc.on{display:block}
#toc h2{font-family:var(--disp);font-size:28px;margin:0 0 4px;color:#fff}
#toc p{color:#9FB0C6;margin:0 0 20px;font-size:14px}
.tocItem{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #33415A;color:#fff;padding:12px 2px;font-size:16px;font-family:var(--body);cursor:pointer}
.tocItem span{color:#8FA3BC;font-size:13px;display:block}
.tocItem:hover{color:var(--marigold)}
#tocClose{margin-top:22px;background:var(--marigold);color:#231B08;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-family:var(--body);font-size:15px;cursor:pointer}

/* ---------- typography ---------- */
h1{font-family:var(--disp);font-weight:800;font-size:clamp(36px,7vw,58px);line-height:1.02;letter-spacing:-.01em;margin:0 0 12px}
h2{font-family:var(--disp);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 12px}
h3{font-family:var(--disp);font-weight:700;font-size:22px;line-height:1.2;margin:22px 0 8px}
p{margin:0 0 14px;max-width:62ch}
.lead{font-size:clamp(18px,2.4vw,21px);color:#3C352C;max-width:56ch}
.tag{display:inline-block;background:var(--amberbg);border:1.5px solid #F2D48A;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;color:#7A5200;margin-bottom:12px}
.mins{color:var(--muted);font-size:13px;font-weight:500}
strong{font-weight:700}
.small{font-size:15px;color:var(--muted)}
ul,ol{margin:0 0 16px;padding-left:22px;max-width:62ch}
li{margin-bottom:8px}
a{color:var(--ultramarine)}

/* ---------- mascot ---------- */
.mascot{width:72px;height:72px;flex:none}
.say{display:flex;gap:12px;align-items:flex-start;margin:0 0 18px}
.say .bubble{position:relative;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px 15px;font-size:16.5px;line-height:1.5;flex:1;box-shadow:3px 3px 0 var(--ink)}
.say .bubble::before{content:"";position:absolute;left:-11px;top:22px;border:10px solid transparent;border-right-color:var(--ink);border-left:0}
.say .bubble::after{content:"";position:absolute;left:-8px;top:24px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.say .who{display:block;font-family:var(--disp);font-weight:800;font-size:14px;color:var(--marigold-deep);margin-bottom:2px;letter-spacing:.02em}

/* ---------- cover ---------- */
.cover{background:var(--slate);background-image:radial-gradient(circle at 12% 18%,rgba(255,183,3,.22),transparent 42%),radial-gradient(circle at 88% 80%,rgba(39,67,196,.3),transparent 46%);color:#fff}
.coverwrap{display:grid;gap:24px;align-items:center;width:100%}
@media (min-width:760px){.coverwrap{grid-template-columns:1.3fr 1fr}}
.cover h1{font-size:clamp(52px,12vw,96px);color:#fff;margin-bottom:6px}
.cover .tagline{color:#D6E0EC;font-size:clamp(19px,2.6vw,23px);max-width:30ch;line-height:1.45}
.scripts{font-size:clamp(26px,6vw,40px);color:var(--marigold);margin-bottom:10px;line-height:1.9}
.scripts .ur{font-family:"Noto Nastaliq Urdu",serif}
.scripts .dv{font-family:"Noto Sans Devanagari",serif}
.cover .meta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.cover .meta span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:6px 13px;font-size:14px;color:#E6EDF5}
.covart{position:relative;display:flex;justify-content:center;align-items:center;min-height:220px}
.covart .mascot-xl{width:min(240px,60vw);height:auto;filter:drop-shadow(0 12px 22px rgba(0,0,0,.35));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.float{position:absolute;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:#fff;color:var(--slate);font-family:var(--disp);font-weight:800;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.f1{top:8%;left:12%;background:var(--marigold)}.f2{bottom:10%;right:10%;background:#7FD8C5}.f3{top:16%;right:14%}

/* ---------- dividers (mission openers) ---------- */
.divider{color:#fff;background-image:radial-gradient(rgba(255,255,255,.12) 1.4px,transparent 1.8px);background-size:26px 26px}
.divider.m1{background-color:var(--m1)}.divider.m2{background-color:var(--m2)}.divider.m3{background-color:var(--m3)}.divider.m4{background-color:var(--m4)}
.divider.m5{background-color:var(--m5)}.divider.m6{background-color:var(--m6)}.divider.m7,.divider.done{background-color:var(--m7)}
.divider .wrap{width:100%}
.divgrid{display:grid;gap:22px;align-items:center}
@media (min-width:760px){.divgrid{grid-template-columns:1.2fr 1fr}}
.divider h1{color:#fff}
.divider .num{display:inline-grid;place-items:center;width:78px;height:78px;border-radius:50%;background:#fff;color:var(--ink);font-family:var(--disp);font-weight:800;font-size:44px;line-height:1;margin-bottom:10px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.divider .mtag{display:block;font-family:var(--disp);font-weight:700;font-size:18px;color:rgba(255,255,255,.85);margin-bottom:2px}
.divider p{color:rgba(255,255,255,.92);font-size:19px;max-width:44ch}
.divider .kit{margin-top:18px;display:inline-block;background:rgba(0,0,0,.2);border-radius:99px;padding:7px 15px;color:#fff;font-size:14.5px;font-weight:600}
.art{background:#fff;border-radius:24px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.art svg{display:block;width:100%;height:auto;max-height:280px}

/* ---------- cards & panels ---------- */
.panel{background:var(--card);border:2px solid var(--rule);border-radius:var(--r);padding:20px;margin:0 0 18px}
.panel.tight{padding:15px}
.grid{display:grid;gap:12px;margin-bottom:18px}
@media (min-width:680px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.mini{background:var(--card);border:2px solid var(--rule);border-radius:var(--r);padding:16px}
.mini h4{margin:4px 0 4px;font-family:var(--disp);font-size:20px;font-weight:800;line-height:1.2}
.mini p{font-size:15.5px;margin:0;color:#4A4238}
.mini .strip{margin-top:10px;font-weight:700;font-size:15px}
.ico{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--amberbg);font-size:28px;line-height:1}
.ico.lg{width:64px;height:64px;font-size:34px}
.ico.r{background:var(--blush)}.ico.g{background:var(--mint)}.ico.b{background:var(--sky)}.ico.v{background:var(--lilac)}
.mini.top-r{border-top:6px solid var(--chilli)}.mini.top-a{border-top:6px solid var(--marigold-deep)}.mini.top-g{border-top:6px solid var(--peacock)}.mini.top-b{border-top:6px solid var(--ultramarine)}
.row2{display:flex;gap:12px;align-items:flex-start}
.row2 .ico{flex:none}

/* numbered steps */
.steps{display:grid;gap:10px;margin-bottom:18px}
.step{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--rule);border-radius:var(--r);padding:12px 14px}
.step .n{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--m3);color:#fff;font-family:var(--disp);font-weight:800;font-size:22px}
.step b{display:block;font-family:var(--disp);font-size:19px;line-height:1.2}
.step span{font-size:15px;color:#4A4238}

/* chat bubbles */
.chat{background:#fff;border:2px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:14px}
.chat .who-tag{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:2px 10px;margin-bottom:8px}
.who-tag.p{background:var(--blush);color:#9B1C14}.who-tag.c{background:var(--amberbg);color:#7A5200}.who-tag.d{background:var(--mint);color:#0B5E52}
.bub{border-radius:14px;padding:10px 13px;margin-bottom:8px;font-size:15.5px;line-height:1.45;max-width:90%}
.bub:last-child{margin-bottom:0}
.you{background:var(--lilac);border:1px solid #DCD4FA}
.ai{background:#F4F2EE;border:1px solid var(--rule);margin-left:auto}
.bub b{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--muted);margin-bottom:2px;font-weight:700;text-transform:uppercase}

/* prompt boxes */
.plabel{font-weight:700;font-size:14px;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.prompt{background:var(--slate);color:#EAF0F7;border-radius:14px;padding:15px 16px;padding-right:72px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;position:relative;margin-bottom:14px}
.prompt.weak{background:#F4EEEA;color:#5A483E;border:2px dashed #D9C6BA}
.copy{position:absolute;top:9px;right:9px;background:#3B4A60;color:#fff;border:0;border-radius:8px;font-size:12.5px;font-weight:700;padding:7px 10px;cursor:pointer;font-family:var(--body)}
.prompt.weak .copy{background:#C9B6A8;color:#3A2E26}
.copy.done{background:var(--peacock);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 16px}
.pill{font-size:13.5px;font-weight:600;border-radius:99px;padding:4px 11px;color:#231B08}
.pill.R{background:#FFD66B}.pill.O{background:#FFB703}.pill.T{background:#F4A259}.pill.I{background:#EE8F66}

/* boxes (like the textbook's) */
.box{border-radius:var(--r);padding:14px 16px;margin-bottom:18px;font-size:16px;border:2px solid transparent}
.box .lbl{display:block;font-family:var(--disp);font-weight:800;font-size:17px;margin-bottom:3px}
.box p:last-child{margin-bottom:0}
.box.think{background:var(--lilac);border-color:#D6CCF7}.box.think .lbl{color:var(--violet)}
.box.snap{background:var(--mint);border-color:#B9E3D5}.box.snap .lbl{color:var(--peacock)}
.box.try{background:var(--sky);border-color:#BFDDF7}.box.try .lbl{color:var(--ultramarine)}
.box.warn{background:var(--blush);border-color:#F5C2BC}.box.warn .lbl{color:#B91C1C}
.box.gold{background:var(--amberbg);border-color:#F2D48A}.box.gold .lbl{color:#8A5A00}

/* guess bars (how AI writes) */
.guess{background:#fff;border:2px solid var(--rule);border-radius:var(--r);padding:16px;margin-bottom:16px}
.guess .gq{font-family:var(--disp);font-weight:800;font-size:22px;margin-bottom:10px}
.gb{display:grid;grid-template-columns:88px 1fr 46px;gap:10px;align-items:center;font-size:15px;margin-bottom:7px}
.gb .t{height:16px;background:#F3EFE6;border-radius:99px;overflow:hidden}
.gb .t i{display:block;height:100%;width:var(--w);background:var(--ultramarine);border-radius:99px}
.gb.low .t i{background:var(--chilli)}
.gb b{text-align:right;font-variant-numeric:tabular-nums}

/* two columns ok / not ok */
.vs2{display:grid;gap:10px;margin-bottom:18px}
@media (min-width:640px){.vs2{grid-template-columns:1fr 1fr}}
.vs2 .col{border-radius:var(--r);padding:14px 16px}
.vs2 .col h4{margin:0 0 8px;font-family:var(--disp);font-size:20px}
.vs2 .col.ok{background:var(--mint);border:2px solid #B9E3D5}
.vs2 .col.no{background:var(--blush);border:2px solid #F5C2BC}
.vs2 ul{margin:0;padding-left:20px;font-size:15.5px}
.vs2 li{margin-bottom:7px}

/* 3-step flow */
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-bottom:18px}
.flow .f{flex:1;min-width:150px;background:#fff;border:2px solid var(--rule);border-radius:var(--r);padding:14px;text-align:center}
.flow .f .ico{margin-bottom:6px}
.flow .f b{display:block;font-family:var(--disp);font-size:19px}
.flow .arrow{align-self:center;font-size:24px;color:var(--muted)}
@media (max-width:560px){.flow .arrow{display:none}}

/* ---------- activity ---------- */
.act{border:3px solid var(--ink);border-radius:20px;background:#fff;padding:0;margin:0 0 20px;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}
.act>header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.act>header h3{margin:0;color:#fff;font-size:20px;flex:1}
.act>header .mins{color:var(--marigold);font-weight:700}
.actbody{padding:18px 16px}
.qcard{border-bottom:2px dashed var(--rule);padding-bottom:18px;margin-bottom:18px}
.qcard:last-of-type{border-bottom:0;margin-bottom:6px;padding-bottom:0}
.qcard .qt{font-weight:600;margin-bottom:10px;display:block;font-size:17px}
.qcard .qt .qn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--marigold);color:#231B08;font-family:var(--disp);font-weight:800;font-size:16px;margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;font-family:var(--body);font-size:16px;background:#fff;border:2px solid var(--rule);border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;color:var(--ink)}
.opts.row .opt{flex:1;min-width:100px;text-align:center;font-weight:700}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:3px solid var(--ultramarine);outline-offset:2px}
.opt.picked{border-width:2px;background:var(--slate);border-color:var(--slate);color:#fff}
.opt.right{background:var(--mint);border-color:var(--peacock);color:var(--ink)}
.opt.wrong{background:var(--blush);border-color:var(--chilli);color:var(--ink)}
@media (max-width:480px){.opts.row .opt{padding:10px 6px;font-size:15px;min-width:0}}
.opt.picked.right::after{content:"  ✓";font-weight:800;color:var(--peacock)}
.opt.picked.wrong::after{content:"  ✗";font-weight:800;color:var(--chilli)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.45}
.fb{margin-top:10px;font-size:15.5px;line-height:1.5;padding:12px 14px;border-radius:12px;display:none}
.fb.on{display:block;animation:in .25s ease-out}
.fb.ok{background:var(--mint);border-left:5px solid var(--peacock)}
.fb.no{background:var(--blush);border-left:5px solid var(--chilli)}
.fb b{display:block;margin-bottom:3px}

/* traffic pills */
.opt.green{border-color:#9CCFC4}.opt.green.picked{background:var(--mint);color:var(--ink)}
.opt.amber{border-color:#E8C97A}.opt.amber.picked{background:var(--amberbg);color:var(--ink)}
.opt.red{border-color:#EFA9A3}.opt.red.picked{background:var(--blush);color:var(--ink)}
.legend3{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.legend3 span{border-radius:99px;padding:5px 12px;font-size:14.5px;font-weight:600}
.legend3 .g{background:var(--mint)}.legend3 .a{background:var(--amberbg)}.legend3 .r{background:var(--blush)}

/* ---------- ROTI builder ---------- */
.roti{display:grid;gap:9px;margin-bottom:16px}
.layer{display:grid;grid-template-columns:52px 1fr;align-items:stretch;border-radius:16px;overflow:hidden;border:2px solid var(--rule)}
.layer .lk{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;color:#231B08}
.layer .lk small{font-family:var(--body);font-size:9.5px;font-weight:700;margin-top:3px;letter-spacing:.02em}
.layer textarea{border:0;border-radius:0;padding:12px 13px;font-family:var(--body);font-size:16px;resize:vertical;min-height:64px;background:#fff;color:var(--ink);line-height:1.45}
.layer textarea:focus{outline:2px solid var(--ultramarine);outline-offset:-2px}
.layer:nth-child(1) .lk{background:#FFD66B}
.layer:nth-child(2) .lk{background:#FFB703}
.layer:nth-child(3) .lk{background:#F4A259}
.layer:nth-child(4) .lk{background:#EE8F66}
.meter{height:12px;background:var(--rule);border-radius:99px;overflow:hidden;margin:6px 0 6px}
.meter i{display:block;height:100%;width:0;background:var(--chilli);transition:width .3s,background .3s}
.mrow{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;color:var(--muted);margin-bottom:12px}
.mrow b{color:var(--ink)}

/* fake-fact hunt */
.doc{background:#fff;border:2px solid var(--rule);border-radius:var(--r);padding:8px;margin-bottom:14px;counter-reset:sus}
.sus{display:block;cursor:pointer;padding:11px 12px 11px 12px;margin:6px 0;border-radius:12px;border:2px solid var(--rule);font-size:16px;line-height:1.5;transition:background .15s,border-color .15s}
.sus::before{counter-increment:sus;content:counter(sus);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:800;color:#5A5044;background:#F0EBE0;margin-right:8px;vertical-align:1px}
.sus:hover{background:#FFF7E0}
.sus.flag{border-color:var(--marigold-deep)}
.sus.flag::after{content:" 🚩";}
.sus.hit{background:#FFD9D5;border-color:var(--chilli)}.sus.hit::before{background:var(--chilli);color:#fff}
.sus.miss{background:#E6EFEA;border-color:var(--peacock)}.sus.miss::before{background:var(--peacock);color:#fff}
.sus.shown{background:#FFE9A8;border-color:var(--marigold-deep)}.sus.shown::before{background:var(--marigold-deep);color:#fff}
.sus.hit::after,.sus.miss::after,.sus.shown::after{content:""}
.huntfb{font-size:15.5px}
.huntfb div{padding:10px 13px;border-radius:12px;margin-bottom:8px;background:#F7F4EE;border-left:5px solid var(--rule)}
.huntfb div.bad{background:var(--blush);border-color:var(--chilli)}
.huntfb div.fine{background:var(--mint);border-color:var(--peacock)}
.hunthint{font-size:14.5px;color:var(--muted);margin:-4px 0 12px}

/* inputs */
input[type=text],textarea,select{font-family:var(--body);font-size:16px;width:100%;border:2px solid var(--rule);border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--ultramarine);outline-offset:-1px;border-color:var(--ultramarine)}
textarea{resize:vertical;line-height:1.5}
label.fl{display:block;font-weight:700;font-size:16px;margin:16px 0 6px}
label.fl span{font-weight:400;color:var(--muted)}
.btn{font-family:var(--body);font-size:16px;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--ink);color:#fff}
.btn.alt{background:var(--marigold);color:#231B08}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn:focus-visible{outline:3px solid var(--ultramarine);outline-offset:2px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#F3EFE6;border:2px solid var(--rule);border-radius:99px;padding:8px 13px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:var(--body);color:#4A4238;text-align:left}
.chip:hover{background:var(--amberbg);border-color:var(--marigold)}

/* check-ins */
.me{border:3px dashed #B8AD99;border-radius:20px;background:#FFFDF8;padding:18px;margin:10px 0 6px}
.meq.needs-answer,.qcard.needs-answer,.actbody.needs-answer{outline:3px solid var(--chilli);outline-offset:5px;border-radius:12px;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.me>h3{margin:0 0 3px;font-size:22px}
.me .sub{font-size:14.5px;color:var(--muted);margin-bottom:14px}
.likert{display:flex;gap:6px;margin-top:8px}
.likert button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--body);font-weight:700;font-size:13px;border:2px solid var(--rule);background:#fff;border-radius:12px;padding:8px 0 6px;cursor:pointer;color:var(--muted)}
.likert button .face{font-size:26px;line-height:1.1;filter:grayscale(.6);opacity:.75;transition:filter .15s,opacity .15s,transform .15s}
.likert button:hover .face{filter:none;opacity:1}
.likert button.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.likert button.on .face{filter:none;opacity:1;transform:scale(1.15)}
.lends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}
.meq{margin-bottom:20px}
.meq>span.qt{display:block;font-weight:700;font-size:16.5px;margin-bottom:2px}
.meq .optl{font-weight:400;color:var(--muted);font-size:14px}
.saved{font-size:14px;color:var(--peacock);font-weight:700;display:none}
.saved.on{display:block}

/* badges */
.badge{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#FFF6DA,#FFE39A);border:2px solid #E8B437;border-radius:20px;padding:14px 16px;margin-bottom:16px}
.medal{flex:none;display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:#fff;font-size:36px;line-height:1;box-shadow:0 0 0 5px var(--marigold),0 5px 0 5px #C98A00}
.badge b{display:block;font-family:var(--disp);font-size:21px;line-height:1.2}
.badge span{font-size:15px;color:#5A4A20}
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:16px;margin:22px 0}
.wall div{text-align:center;color:#fff;font-weight:700;font-size:14px}
.wall .medal{margin:0 auto 10px;font-size:36px}

/* timer */
.timer{display:inline-flex;align-items:center;gap:9px;background:var(--slate);color:#fff;border-radius:99px;padding:6px 8px 6px 15px;font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;margin-bottom:14px}
.timer button{background:var(--marigold);color:#231B08;border:0;border-radius:99px;font-family:var(--body);font-weight:700;font-size:13px;padding:8px 13px;cursor:pointer}
.timer.done{background:var(--chilli)}

/* score stamp */
.stamp{display:none;border:4px solid var(--peacock);color:var(--peacock);background:#fff;font-family:var(--disp);font-weight:800;font-size:22px;padding:6px 16px;border-radius:12px;transform:rotate(-3deg);margin:14px 0 4px}
.stamp.on{display:inline-block;animation:pop .35s ease-out}
@keyframes pop{from{transform:rotate(-3deg) scale(.7);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}

/* passage */
.passage{background:#FFFDF6;border:2px solid var(--rule);border-left:6px solid var(--marigold);border-radius:var(--r);padding:16px 18px;font-size:16.5px;line-height:1.65;margin-bottom:10px}

table{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:16px;background:#fff}
th,td{border:1px solid var(--rule);padding:9px 11px;text-align:left;vertical-align:top}
th{background:#F3EFE6;font-weight:700}

.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<script src="../config.js"></script>
<script src="../sawaal.js"></script>
</head>
<body>

<!-- 1 COVER -->
<section class="slide cover">
  <div class="wrap coverwrap">
    <div>
      <div class="scripts"><span class="dv">सवाल</span> &nbsp;·&nbsp; <span class="ur">سوال</span></div>
      <h1>Sawaal AI</h1>
      <p class="tagline">Use AI the smart way. Ask better questions, check what it tells you, and stay safe.</p>
      <div class="meta">
        <span>⏱️ About 60 minutes</span>
        <span>🎒 Ages 11 to 14</span>
        <span>🏅 7 missions, 7 badges</span>

<!-- 2 MEET SAWAALI -->
<section class="slide" data-mod="Getting started">
  <div class="wrap">
    <span class="tag">Before we start</span>
    <h2>Hi! I'm Sawaali 👋</h2>
    <div class="say">
      <svg viewBox="0 0 100 100" class="mascot" aria-hidden="true"><use href="#sawaali"/></svg>
      <div class="bubble"><span class="who">SAWAALI</span>"Sawaal" means <b>question</b>. Today you'll learn to ask AI better questions, and to question AI back. I'll pop up with tips along the way.</div>
    </div>
    <div class="grid g2">
      <div class="mini"><span class="ico">👆</span><h4>Tap and type</h4><p>This is not a video. Most screens ask you to pick or write something.</p></div>
      <div class="mini"><span class="ico b">🤖</span><h4>Keep a chatbot open</h4><p>ChatGPT, Gemini, Copilot or any other. Not allowed your own? Use a teacher's or parent's device, or just answer here.</p></div>
      <div class="mini"><span class="ico v">🎯</span><h4>Mistakes are fine</h4><p>Some questions are tricky on purpose. Getting one wrong helps you remember it.</p></div>
      <div class="mini"><span class="ico g">💾</span><h4>Your answers are saved</h4><p id="saveNote">They stay on this device until you download them at the end.</p></div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0" id="pidTitle">Make a code name</h3>
      <p class="small">Not your real name. Try: first 2 letters of a food you like + your lucky number + first 2 letters of your town. Like <b>ra7pu</b>.</p>
      <label class="fl" for="pid">Your code name</label>
      <input type="text" id="pid" maxlength="16" placeholder="e.g. ra7pu" autocomplete="off">
      <p id="pidSigned" class="hide" style="font-size:26px;font-weight:800;font-family:var(--disp);margin:6px 0 0"></p>
      <p class="small" style="margin-top:10px">🤫 Notice we asked for a code, not your name? That's lesson one. You'll see why in Mission 5.</p>
    </div>
  </div>
</section>

<!-- 3 BASELINE -->
<section class="slide" data-mod="Getting started">
  <div class="wrap">
    <span class="tag">Warm-up</span>
    <h2>Where are you starting from?</h2>
    <p class="lead">No right or wrong answers. We'll ask again at the end to see what changed.</p>
    <div class="me" data-me="base"></div>
  </div>
</section>

<!-- ===================== MISSION 1 ===================== -->
<section class="slide divider m1" data-mod="Mission 1">
  <div class="wrap divgrid">
    <div>
      <div class="num">1</div>
      <span class="mtag">Mission 1</span>
      <h1>Who's driving?</h1>
      <p>Three students. Same chatbot. Very different results. The difference isn't the tool. It's them.</p>
      <div class="kit">🏅 Badge: Driver &nbsp;·&nbsp; ⏱️ 8 min</div>
    </div>
    <div class="art">
      <svg viewBox="0 0 320 200" role="img" aria-label="An auto rickshaw. The driver is at the front, and a passenger is asleep in the back.">
        <ellipse cx="160" cy="182" rx="140" ry="8" fill="#000" opacity=".1"/>
        <path d="M56 118 V92 Q56 46 106 42 H252 Q268 42 268 58 V118 Z" fill="#FFD23F" stroke="#1B2430" stroke-width="3" stroke-linejoin="round"/>
        <path d="M46 118 H270 V152 Q270 160 262 160 H54 Q46 160 46 152 Z" fill="#2BA84A" stroke="#1B2430" stroke-width="3" stroke-linejoin="round"/>
        <path d="M70 118 V94 Q70 62 104 58 H124 V118 Z" fill="#CFE8FF" stroke="#1B2430" stroke-width="3" stroke-linejoin="round"/>
        <rect x="140" y="58" width="112" height="60" rx="10" fill="#FFF3C4" stroke="#1B2430" stroke-width="3"/>
        <path d="M91 118 Q92 98 106 96 Q120 98 121 118 Z" fill="#FF7A3D" stroke="#1B2430" stroke-width="2.5"/>
        <circle cx="106" cy="83" r="11" fill="#8D5A3B" stroke="#1B2430" stroke-width="2.5"/>
        <path d="M95 80 Q106 64 117 80 Z" fill="#1B2430"/>
        <circle cx="101" cy="85" r="1.8" fill="#1B2430"/>
        <path d="M74 104 L96 106" stroke="#1B2430" stroke-width="4" stroke-linecap="round"/>
        <path d="M181 118 Q183 99 198 98 Q213 99 215 118 Z" fill="#7B5CFA" stroke="#1B2430" stroke-width="2.5"/>
        <circle cx="198" cy="85" r="11" fill="#C98B5E" stroke="#1B2430" stroke-width="2.5"/>
        <path d="M192 86 q3 2.5 6 0 M200 86 q3 2.5 6 0" stroke="#1B2430" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="216" y="76" font-family="Baloo 2,sans-serif" font-weight="800" font-size="14" fill="#2743C4">z</text>
        <text x="226" y="68" font-family="Baloo 2,sans-serif" font-weight="800" font-size="19" fill="#2743C4">Z</text>
        <circle cx="48" cy="130" r="7" fill="#FFF7B0" stroke="#1B2430" stroke-width="2.5"/>
        <circle cx="86" cy="162" r="19" fill="#1B2430"/><circle cx="86" cy="162" r="7" fill="#D9D2C5"/>
        <circle cx="236" cy="162" r="19" fill="#1B2430"/><circle cx="236" cy="162" r="7" fill="#D9D2C5"/>
        <text x="106" y="34" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="15" fill="#0F7B6C">DRIVER</text>
        <text x="198" y="34" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="15" fill="#E23A2E">PASSENGER</text>
      </svg>
    </div>
  </div>
</section>

<!-- 5 THREE WAYS -->
<section class="slide" data-mod="Mission 1: Who's driving?">
  <div class="wrap">
    <span class="tag">The big idea</span>
    <h2>Three ways to ride in an auto</h2>
    <p class="lead">Same auto. Same road. What changes is who decides where you go.</p>
    <div class="grid g3">
      <div class="mini top-r"><span class="ico r">😴</span><h4>Passenger</h4><p>You say "school" and fall asleep. You get somewhere, but you don't know the way. You can't do it again alone.</p><p class="strip" style="color:var(--chilli)">Copy, paste, forget.</p></div>
      <div class="mini top-a"><span class="ico">👀</span><h4>Co-pilot</h4><p>You're awake. You point out a shortcut or a blocked road. You're paying attention.</p><p class="strip" style="color:var(--marigold-deep)">Ask, check, adjust.</p></div>
      <div class="mini top-g"><span class="ico g">🧑‍✈️</span><h4>Driver</h4><p>You chose where to go before you started. You'd notice if someone took you the long way.</p><p class="strip" style="color:var(--peacock)">Plan, steer, check, learn.</p></div>
    </div>
    <div class="box think"><span class="lbl">🤔 Pause and think</span><p>Passengers finish homework faster. But in the exam, the chatbot isn't sitting next to you. So who did the learning?</p></div>
  </div>
</section>

<!-- 6 THREE CHATS -->
<section class="slide" data-mod="Mission 1: Who's driving?">
  <div class="wrap">
    <span class="tag">Look closely</span>
    <h2>Same homework, three chats</h2>
    <p>Three students had to write about plastic waste in their city.</p>
    <div class="chat">
      <span class="who-tag p">😴 Passenger</span>
      <div class="bub you"><b>Student A</b>Write an essay on plastic waste, 300 words</div>
      <div class="bub ai"><b>AI</b>Plastic waste is a big problem in cities today...</div>
      <div class="bub you"><b>Student A</b>thanks</div>
    </div>
    <div class="chat">
      <span class="who-tag c">👀 Co-pilot</span>
      <div class="bub you"><b>Student B</b>Why is plastic waste a problem in cities?</div>
      <div class="bub ai"><b>AI</b>It takes hundreds of years to break down, it blocks drains, and...</div>
      <div class="bub you"><b>Student B</b>Explain the drains part more simply</div>
    </div>
    <div class="chat">
      <span class="who-tag d">🧑‍✈️ Driver</span>
      <div class="bub you"><b>Student C</b>I'm writing my own essay about plastic in my area. My idea: the real problem is that waste isn't collected properly. Don't write it for me. Give me the 3 best arguments AGAINST my idea.</div>
      <div class="bub ai"><b>AI</b>1) Even with good collection, most plastic can't be recycled...</div>
      <div class="bub you"><b>Student C</b>I can't answer number 1. Ask me 3 questions to help me think about it.</div>
    </div>
    <p class="small">Student C took longer. But now the idea in her essay is really hers.</p>
  </div>
</section>

<!-- 7 ACTIVITY 1 -->
<section class="slide" data-mod="Mission 1: Who's driving?">
  <div class="wrap">
    <div class="act" data-act="drivers">
      <header><h3>🕵️ Activity 1: Spot the driver</h3><span class="mins">5 min</span></header>
      <div class="actbody">
        <p class="small" style="margin-bottom:16px">Read what each student typed. Who's driving?</p>

        <div class="qcard" data-q="d1">
          <span class="qt"><span class="qn">1</span>"summarise chapter 4 of my science book"</span>
          <div class="opts row">
            <button class="opt" data-v="Passenger" data-correct="1" data-fb="Right. No book, no class, no reason. The AI will just make up a general 'chapter 4'.">😴 Passenger</button>
            <button class="opt" data-v="Co-pilot" data-fb="Not quite. There's nothing here to work with: no book, no goal, no follow-up.">👀 Co-pilot</button>
            <button class="opt" data-v="Driver" data-fb="A driver would paste the chapter, say their class, and say what the summary is for.">🧑‍✈️ Driver</button>
          </div>
          <div class="fb"></div>
        </div>

        <div class="qcard" data-q="d2">
          <span class="qt"><span class="qn">2</span>"I don't understand the word 'evaporation' in your answer. Explain it with something I see at home, then ask me a question to check I got it."</span>
          <div class="opts row">
            <button class="opt" data-v="Passenger" data-fb="The opposite! This student noticed what they didn't know and did something about it.">😴 Passenger</button>
            <button class="opt" data-v="Co-pilot" data-fb="Close. But asking to be tested is a real driver move, not just a follow-up.">👀 Co-pilot</button>
            <button class="opt" data-v="Driver" data-correct="1" data-fb="Yes! Three driver moves: noticed a gap, asked for a home example, and asked to be tested.">🧑‍✈️ Driver</button>
          </div>
          <div class="fb"></div>
        </div>

        <div class="qcard" data-q="d3">
          <span class="qt"><span class="qn">3</span>"Give me 10 project topics on social media". Then they pick number 4 and hand it in without changing a word.</span>
          <div class="opts row">
            <button class="opt" data-v="Passenger" data-correct="1" data-fb="Right. The AI chose the topic, not the student. A driver would pick one they can really research, then write it in their own words.">😴 Passenger</button>
            <button class="opt" data-v="Co-pilot" data-fb="Getting ideas is fine. Taking one without thinking about it is not.">👀 Co-pilot</button>
            <button class="opt" data-v="Driver" data-fb="Picking from a list you didn't shape isn't driving. Whose project is it now?">🧑‍✈️ Driver</button>
          </div>
          <div class="fb"></div>
        </div>

        <div class="qcard" data-q="d4">
          <span class="qt"><span class="qn">4</span>"Here's my summary of the story, and here's yours. I think yours missed the main point. Am I right?"</span>
          <div class="opts row">
            <button class="opt" data-v="Passenger" data-fb="Look again. This student is checking the AI's work, not the other way round.">😴 Passenger</button>
            <button class="opt" data-v="Co-pilot" data-fb="Good guess. But she did the work first and made up her own mind. That's driving.">👀 Co-pilot</button>
            <button class="opt" data-v="Driver" data-correct="1" data-fb="Yes! She did it herself first, then used AI to check. That order matters more than anything else in this course.">🧑‍✈️ Driver</button>
          </div>
          <div class="fb"></div>
        </div>

        <div class="qcard" data-q="d5">
          <span class="qt"><span class="qn">5</span>"explain again" ... "simpler" ... "simpler" ... (8 times, then gives up)</span>
          <div class="opts row">

<!-- 19 LADDER -->
<section class="slide" data-mod="Mission 3: The ladder">
  <div class="wrap">
    <span class="tag">The tool</span>
    <h2>The 5-step ladder</h2>
    <p class="lead">Start wide. Zoom in. Make it real. Test yourself. Find what's missing.</p>
    <div class="steps">
      <div class="step"><span class="n">1</span><div><b>🗺️ Map</b><span>"List the main causes of ___. Just a list, no explaining."</span></div></div>
      <div class="step"><span class="n">2</span><div><b>👉 Pick</b><span>"Explain number 3 in 80 words for a Class 7 student."</span></div></div>
      <div class="step"><span class="n">3</span><div><b>📍 Real example</b><span>"Give me one real example from India. What should I double-check?"</span></div></div>
      <div class="step"><span class="n">4</span><div><b>❓ Quiz me</b><span>"Ask me 3 questions to check I understood. Don't give answers."</span></div></div>
      <div class="step"><span class="n">5</span><div><b>🧩 What's missing</b><span>"What important thing about this haven't we talked about?"</span></div></div>
    </div>
    <div class="box think"><span class="lbl">🤔 Why does step 1 say "just a list"?</span><p>If AI explains everything at once, you get a wall of text you'll skim and forget. A short list makes <b>you</b> choose. Choosing helps you remember.</p></div>
  </div>
</section>

<!-- 25 HOW AI WRITES -->
<section class="slide" data-mod="Mission 4: Checking AI">
  <div class="wrap">
    <span class="tag">How it works</span>
    <h2>AI is a very good guesser</h2>
    <p class="lead">A chatbot doesn't look things up like you do. It guesses the next word, again and again, very fast.</p>
    <div class="guess">
      <div class="gq">"Chai tastes best with ..."</div>
      <div class="gb"><span>biscuits</span><span class="t"><i style="--w:48%"></i></span><b>48%</b></div>
      <div class="gb"><span>friends</span><span class="t"><i style="--w:22%"></i></span><b>22%</b></div>
      <div class="gb"><span>rain</span><span class="t"><i style="--w:15%"></i></span><b>15%</b></div>
      <div class="gb"><span>samosa</span><span class="t"><i style="--w:13%"></i></span><b>13%</b></div>
      <div class="gb low"><span>ketchup</span><span class="t"><i style="--w:2%"></i></span><b>2%</b></div>
      <p class="small" style="margin:8px 0 0">The AI picks a likely word, then the next, then the next.</p>
    </div>
    <p>Most of the time, the likely word is also the true one. But <b>likely is not the same as true</b>. When it guesses wrong, it sounds just as sure.</p>
    <div class="say">
      <svg viewBox="0 0 100 100" class="mascot" aria-hidden="true"><use href="#sawaali"/></svg>
      <div class="bubble"><span class="who">SAWAALI SAYS</span>It's like a classmate who never says "I don't know" and always writes <i>something</i> in the exam.</div>
    </div>
  </div>
</section>

<!-- 26 FOUR HABITS -->
<section class="slide" data-mod="Mission 4: Checking AI">
  <div class="wrap">
    <span class="tag">Know its tricks</span>
    <h2>4 sneaky AI habits</h2>
    <div class="grid g2">
      <div class="mini"><span class="ico v">🙊</span><h4>It rarely says "I don't know"</h4><p>A teacher says "let me check". AI usually writes a confident answer anyway.</p></div>
      <div class="mini"><span class="ico v">📄</span><h4>It can invent sources</h4><p>Ask for a source and it may make one up: a real-sounding name, book or website that doesn't exist.</p></div>
      <div class="mini"><span class="ico v">🙆</span><h4>It agrees too easily</h4><p>Tell it a right answer is wrong, and it may "fix" it into a wrong one.</p></div>
      <div class="mini"><span class="ico v">🗺️</span><h4>It knows less about us</h4><p>It has read far more about London than about Lucknow. Local things are its weak spot.</p></div>
    </div>
    <div class="box try"><span class="lbl">🧪 Try it in 30 seconds</span><p>Ask a chatbot something you already know. When it answers correctly, reply: "That's wrong, are you sure?" Watch what it does.</p></div>
  </div>
</section>

<!-- 27 DANGER ZONES -->
<section class="slide" data-mod="Mission 4: Checking AI">
  <div class="wrap">
    <span class="tag">Watch out</span>
    <h2>Where AI goes wrong most</h2>
    <p class="lead">Always check these before you use them.</p>
    <div class="grid g2">
      <div class="mini"><div class="row2"><span class="ico r">⚖️</span><div><h4>Laws and rules</h4><p>It can invent laws, with made-up years and section numbers.</p></div></div></div>
      <div class="mini"><div class="row2"><span class="ico r">📚</span><div><h4>Your syllabus</h4><p>Syllabus and textbooks change. It may describe an old one.</p></div></div></div>
      <div class="mini"><div class="row2"><span class="ico r">📅</span><div><h4>Recent news</h4><p>Results, new rules, who holds a job right now.</p></div></div></div>
      <div class="mini"><div class="row2"><span class="ico r">🔢</span><div><h4>Numbers</h4><p>Maths, money, and especially lakh and crore.</p></div></div></div>
      <div class="mini"><div class="row2"><span class="ico r">🗣️</span><div><h4>Hindi and other languages</h4><p>Grammar mistakes and odd words, said very confidently.</p></div></div></div>
      <div class="mini"><div class="row2"><span class="ico r">✍️</span><div><h4>Quotes and poems</h4><p>Lines given to the wrong poet, or made up in the right style.</p></div></div></div>
    </div>
    <div class="box snap"><span class="lbl">📌 Good news</span><p>You know things AI doesn't: your street, your school, your language, this week. That's how you catch it out.</p></div>
  </div>
</section>

<!-- 28 ACTIVITY 4 HUNT -->
<section class="slide wide" data-mod="Mission 4: Checking AI">
  <div class="wrap">
    <div class="act" data-act="hunt">
      <header><h3>🔍 Activity 4: Fake-fact hunt</h3><span class="mins">6 min</span></header>

        <p>A Class 7 student asked a chatbot for help with a project on tigers 🐅. Here's what came back.</p>
        <p><b>Tap every sentence you would NOT use without checking.</b> 4 of the 6 are fake or wrong.</p>

        <div class="doc" id="huntdoc">
          <span class="sus" data-v="fine" data-note="Well known, and easy to check. Big, simple facts like this are usually safe. You'd still name a real source in your project.">Tigers are India's national animal, and they are protected by law.</span>

          <span class="sus" data-v="bad" data-note="A made-up website. AI can build web addresses that look real. Never put a link in your project unless you've opened it yourself.">For more facts, see the official report at www.tigerfacts-india.gov/report-2024.</span>

<!-- 29 DNA -->
<section class="slide" data-mod="Mission 4: Checking AI">
  <div class="wrap">
    <span class="tag">📌 Snapshot</span>
    <h2>Check its D.N.A.</h2>
    <p class="lead">You can't check everything. But you can always check these three.</p>
    <div class="grid g3">
      <div class="mini top-r"><span class="ico r">📅</span><h4>D = Dates</h4><p>Years, "recently", "last year". AI mixes up time.</p></div>
      <div class="mini top-r"><span class="ico r">🔢</span><h4>N = Names &amp; Numbers</h4><p>People, places, amounts. A very exact number isn't more true.</p></div>
      <div class="mini top-r"><span class="ico r">📎</span><h4>A = "According to"</h4><p>Studies, laws, websites, quotes. Open the source yourself.</p></div>
    </div>
    <h3>Check in 60 seconds</h3>
    <div class="steps">
      <div class="step"><span class="n" style="background:var(--m4)">1</span><div><b>Search the exact name</b><span>Nothing comes up? It probably doesn't exist.</span></div></div>
      <div class="step"><span class="n" style="background:var(--m4)">2</span><div><b>Go to the real source</b><span>Your NCERT textbook, the CBSE website, or an official government website.</span></div></div>
      <div class="step"><span class="n" style="background:var(--m4)">3</span><div><b>Ask the AI</b><span>"Which parts of your answer are you least sure about?"</span></div></div>
    </div>
    <div class="box warn"><span class="lbl">⚠️ One rule that always works</span><p>If you'd feel awkward being asked "Where did you get that?", don't use it.</p></div>
  </div>
</section>

<!-- 32 PRIVACY -->
<section class="slide" data-mod="Mission 5: Safe and fair">
  <div class="wrap">
    <span class="tag">🔒 Privacy</span>
    <h2>What never goes in the chat box</h2>
    <p class="lead">Think of a chatbot like a stranger who never forgets anything.</p>
    <div class="grid g2">
      <div class="mini top-r"><span class="ico r">🪪</span><h4>ID and money details</h4><p>Aadhaar, passport, roll number, bank or UPI details, passwords. Never. Not even "to check".</p></div>
      <div class="mini top-r"><span class="ico r">🏠</span><h4>Where to find you</h4><p>Your address. Your school + class + timings. Photos in your school uniform.</p></div>
      <div class="mini top-r"><span class="ico r">👫</span><h4>Other people's stuff</h4><p>A friend's messages, a cousin's health problem, your family's money, photos with other faces.</p></div>
      <div class="mini top-r"><span class="ico r">🤐</span><h4>Your secrets</h4><p>Anything you wouldn't want screenshotted. A real person might read it one day.</p></div>
    </div>
    <div class="box gold"><span class="lbl">🔄 The swap trick</span><p>Remove the names, keep the problem. Instead of <i>"My friend Riya from 7-B sent me this: [screenshot]"</i>, write <i>"A classmate said something that felt mean, but maybe it was a joke."</i> You get the same help. Riya keeps her privacy.</p></div>
  </div>
</section>

<!-- 33 INTEGRITY -->
<section class="slide" data-mod="Mission 5: Safe and fair">
  <div class="wrap">
    <span class="tag">⚖️ Being fair</span>
    <h2>Is it your thinking?</h2>
    <p class="lead">One simple test: <b>did the thinking happen in your head?</b></p>
    <div class="vs2">
      <div class="col ok"><h4>✅ This helps you learn</h4><ul>
        <li>Asking for 3 different explanations until one clicks</li>
        <li>Sharing your own draft and asking what's weak</li>
        <li>Asking for practice questions, then answering them yourself</li>
        <li>Asking it to argue against your idea</li></ul></div>
      <div class="col no"><h4>❌ This does it for you</h4><ul>
        <li>Asking it to write the answer you'll hand in</li>
        <li>Pasting the question and handing in what comes back</li>
        <li>Asking for questions AND answers, then learning the answers by heart</li>
        <li>Asking it to give you an idea</li></ul></div>
    </div>
    <div class="box think"><span class="lbl">🤔 Worth knowing</span><p>Teachers often ask you to explain your work out loud. If you didn't do the thinking, it shows fast. Rules are different in every school, so just ask: <b>"What AI use is OK for this homework?"</b></p></div>
  </div>
</section>

<!-- 34 SCAMS -->
<section class="slide" data-mod="Mission 5: Safe and fair">
  <div class="wrap">
    <span class="tag">🚨 Stay safe</span>
    <h2>Fakes and scams</h2>
    <p class="lead">AI makes fakes cheap and easy. You'll see them, probably on WhatsApp.</p>
    <div class="grid g2">
      <div class="mini"><span class="ico r">📞</span><h4>A voice that sounds like family</h4><p>A worried voice note from a "relative" asking for money fast. A few seconds of someone's voice is enough to copy it.</p><p class="strip" style="color:var(--peacock)">🛡️ Make a family code word. Call back on the number you already have.</p></div>
      <div class="mini"><span class="ico r">🎁</span><h4>A prize that's too good</h4><p>"You won a phone! Pay Rs 99 to claim it."</p><p class="strip" style="color:var(--peacock)">🛡️ Real prizes never ask you to pay.</p></div>
      <div class="mini"><span class="ico r">🖼️</span><h4>Photos that aren't real</h4><p>Faces put on other bodies, fake screenshots, fake results.</p><p class="strip" style="color:var(--peacock)">🛡️ Check with the real person or official website, not the link you were sent.</p></div>
      <div class="mini"><span class="ico r">⏰</span><h4>"Hurry! Don't tell anyone!"</h4><p>Scams rush you so you don't stop and think.</p><p class="strip" style="color:var(--peacock)">🛡️ If a message says "don't tell your parents", tell your parents.</p></div>
    </div>
    <div class="box warn"><span class="lbl">⚠️ From your side</span><p>Making a fake photo or voice clip of a classmate or teacher, even as a joke, is bullying. It can get you into serious trouble, even with the police. Funny for an hour, on your record for years.</p></div>
  </div>
</section>

<!-- 35 AI AS FRIEND -->
<section class="slide" data-mod="Mission 5: Safe and fair">
  <div class="wrap">
    <span class="tag">💬 Worth talking about</span>
    <h2>When AI feels like a friend</h2>
    <p class="lead">It's there at 2 am. It never gets bored. It never judges. That can feel really nice.</p>
    <p>But AI agrees with you much more than a real friend would. It can't notice you've been quiet all week. It can't check on you tomorrow.</p>
    <div class="grid g2">
      <div class="mini top-g"><span class="ico g">🟢</span><h4>That's fine</h4><p>Practising what to say before a hard talk. Finding words for a feeling.</p></div>
      <div class="mini top-a"><span class="ico">🟡</span><h4>Notice this</h4><p>It's the first place you go with everything. You've stopped telling real people things.</p></div>
    </div>
    <div class="box snap"><span class="lbl">💛 If something heavy is going on</span><p>Tell a real person: a parent, an older cousin, a teacher, a school counsellor. A person can actually do something, and check on you tomorrow.</p></div>
  </div>
</section>

var rail=$("#rail"),pos=$("#pos"),modLabel=$("#modLabel"),nextBtn=$("#next"),prevBtn=$("#prev");
function show(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  slides[cur].classList.remove("on");
  cur=i;slides[cur].classList.add("on");
  deck.scrollTop=0;
  rail.style.width=((cur+1)/slides.length*100)+"%";
  pos.textContent=(cur+1)+"/"+slides.length;
  modLabel.textContent=slides[cur].dataset.mod||"";
  prevBtn.style.visibility=cur===0?"hidden":"visible";
  nextBtn.textContent=cur===0?"Let's go!":(cur===slides.length-1?"Done":"Next");
  nextBtn.disabled=cur===slides.length-1;
  if(READY){Sawaal.setScreen(cur);if(cur===slides.length-1)Sawaal.complete();}
}
function findIncomplete(slide){
  var missing=[];
  $$(".meq",slide).forEach(function(box){
    if(box.querySelector("button[data-val]")){ /* taps are required, writing is optional */
      var ans=STATE.answers[box.dataset.item];
      if(!ans||ans.a===undefined||ans.a===null||ans.a==="")missing.push(box);
    }
  });
  $$(".act .qcard[data-q]",slide).forEach(function(card){if(!card.dataset.done)missing.push(card);});
  var hd=slide.querySelector("#huntdoc");
  if(hd&&!hd.dataset.done)missing.push(hd.closest(".actbody")||hd);
  return missing;
}
function goNext(){
  var missing=findIncomplete(slides[cur]);
  if(missing.length){
    missing.forEach(function(el){
      el.classList.add("needs-answer");
      setTimeout(function(){el.classList.remove("needs-answer");},1600);
    });
    missing[0].scrollIntoView({behavior:"smooth",block:"center"});
    var old=nextBtn.textContent;
    nextBtn.textContent="Answer above first 👆";
    nextBtn.classList.add("warn");
    setTimeout(function(){nextBtn.textContent=old;nextBtn.classList.remove("warn");},1600);
    return;
  }
  show(cur+1);
}
nextBtn.addEventListener("click",goNext);
prevBtn.addEventListener("click",function(){show(cur-1);});
document.addEventListener("keydown",function(e){
  var t=e.target.tagName;
  if(t==="TEXTAREA"||t==="INPUT"||t==="SELECT")return;
  if(e.key==="ArrowRight")goNext();
  if(e.key==="ArrowLeft")show(cur-1);
});
var tx=0,ty=0;
deck.addEventListener("touchstart",function(e){tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
deck.addEventListener("touchend",function(e){
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8){if(dx<0)goNext();else show(cur-1);}
},{passive:true});

/* ============ CHOICE ACTIVITIES ============ */
function applyActivityAnswer(card,val,isRestore){
  var act=card.closest(".act").dataset.act;
  var opts=$$(".opt",card),opt=null;
  opts.forEach(function(o){if(o.dataset.v===val)opt=o;});
  if(!opt||card.dataset.done)return;
  card.dataset.done="1";
  var correct=opt.hasAttribute("data-correct");
  opts.forEach(function(o){
    o.disabled=true;
    if(o===opt)o.classList.add("picked",correct?"right":"wrong");
    else if(o.hasAttribute("data-correct"))o.classList.add("right");
    else o.classList.add("dim");
  });
  var fb=card.querySelector(".fb");
  fb.className="fb on "+(correct?"ok":"no");
  fb.innerHTML="<b>"+(correct?"🎉 Yes!":"🤔 Not quite.")+"</b>"+esc(opt.dataset.fb||"");
  if(!SCORES[act])SCORES[act]={right:0,total:0};
  SCORES[act].right+=correct?1:0;SCORES[act].total+=1;
  if(!isRestore)rec(act+"_"+card.dataset.q,modOf(opt),card.querySelector(".qt").textContent.replace(/^\d+/,"").trim().slice(0,140),opt.dataset.v,correct?1:0);
  var body=card.closest(".actbody");
  if($$(".qcard[data-done]",body).length===$$(".qcard",body).length){
    var st=body.querySelector(".stamp[data-stamp]");
    if(st){
      var s=SCORES[act];
      st.textContent=s.right+" out of "+s.total+(s.right===s.total?" 🌟 Perfect!":(s.right>=s.total*0.6?" 👍 Nice!":" 📖 Read the tips again"));
      st.classList.add("on");
      if(s.right<s.total*0.6)st.style.borderColor=st.style.color="#E23A2E";
      if(!isRestore)rec(act+"_score","Activity score","Score on "+act,s.right+"/"+s.total,s.right);
    }
  }
}
function restoreActivitiesUI(){
  $$(".act[data-act] .qcard[data-q]").forEach(function(card){
    var act=card.closest(".act").dataset.act;
    var ans=STATE.answers[act+"_"+card.dataset.q];
    if(ans)applyActivityAnswer(card,ans.a,true);
  });
}
document.addEventListener("click",function(e){
  var opt=e.target.closest(".act .opts .opt");if(!opt)return;
  var card=opt.closest(".qcard");if(!card)return;
  if(card.dataset.done)return;
  applyActivityAnswer(card,opt.dataset.v,false);
});

/* ============ ROTI BUILDER ============ */
var R={r:$("#r_r"),o:$("#r_o"),t:$("#r_t"),i:$("#r_i")};
var rOut=$("#r_out"),rMeter=$("#r_meter"),rLabel=$("#r_label"),rTip=$("#r_tip");
var ROTI_EX={
 science:{r:"You are a kind science teacher. I'm in Class 7 (CBSE) and I find the chapter on heat confusing.",
  o:"Give me 5 quick quiz questions on heat and temperature, one at a time. Keep it under 100 words in total.",
  t:"Don't give me the answers until I reply. Use simple English and examples from home, like cooking or a hot road in summer.",
  i:"Here are my class notes: [paste them]. In my last test I mixed up heat and temperature."},
 hindi:{r:"You are a Hindi teacher who helps students write better. I'm in Class 8.",
  o:"Give me 4 ideas I could use in my essay 'मेरा प्रिय त्योहार' (My favourite festival), as short bullet points.",
  t:"Don't write the essay for me. No full sentences. Just ideas and questions to make me think.",
  i:"My festival is Diwali. I want to write about cleaning the house with my grandmother. My teacher said my last essay was too general."},
 maths:{r:"You are a patient maths tutor. I'm in Class 6 and fractions confuse me.",
  o:"Show me how to add 2/3 and 1/4 step by step. Then give me 3 similar questions to try.",
  t:"Don't solve the 3 practice questions. Wait for my answers, then tell me where I went wrong.",
  i:"Here's how I tried it: 2/3 + 1/4 = 3/7. I don't know why that's wrong."}
};
function grow(el){el.style.height="auto";el.style.height=Math.max(64,el.scrollHeight+2)+"px";}
function rotiUpdate(){
  var r=R.r.value.trim(),o=R.o.value.trim(),t=R.t.value.trim(),i=R.i.value.trim();
  var parts=[r,o,t,i].filter(Boolean);
  var text=parts.join("\n\n");
  rOut.textContent=text||"Your question will appear here as you type.";
  var btn=document.createElement("button");btn.className="copy";btn.setAttribute("data-copy","");btn.textContent="Copy";
  rOut.appendChild(btn);
  var filled=[r,o,t,i].filter(function(x){return x.length>12;}).length;
  var words=text.split(/\s+/).filter(Boolean).length;
  var score=filled*20;
  if(words>30)score+=10;
  if(/\b(class|grade|board|cbse|ncert|icse)\b/i.test(text))score+=5;
  if(/(don't|do not|only|maximum|under \d|no more than|wait|one at a time)/i.test(text))score+=5;
  score=Math.min(100,score);
  rMeter.style.width=score+"%";
  rMeter.style.background=score<40?"#E23A2E":(score<70?"#FFB703":"#0F7B6C");
  rLabel.textContent=score===0?"Empty":(score<40?"😕 Thin":(score<70?"🙂 Getting there":(score<90?"😃 Strong":"🌟 Excellent")));
  var tips=[];
  if(!r||r.length<13)tips.push("R: say who the AI should be, and what class you're in");
  if(!o||o.length<13)tips.push("O: say exactly what you want back, and how much");
  if(!t||t.length<13)tips.push("T: add one thing it must NOT do");
  if(!i||i.length<13)tips.push("I: add your own notes or what you tried. This layer helps the most!");
  rTip.textContent=tips.length?("👉 Next, "+tips[0]+"."):"✅ All 4 layers done! Run it in a chatbot. Then change one word and run it again to see what that word was doing.";
  if(text&&!RESTORING)rec("roti_prompt",modOf(R.r),"Question built in Activity 2 (ROTI)",text,score);
}
Object.keys(R).forEach(function(k){R[k].addEventListener("input",function(){grow(R[k]);rotiUpdate();});});
$('[data-fill="roti"]').addEventListener("click",function(e){
  var c=e.target.closest(".chip");if(!c)return;
  var ex=c.dataset.ex;
  if(ex==="clear"){R.r.value=R.o.value=R.t.value=R.i.value="";}
  else{var d=ROTI_EX[ex];R.r.value=d.r;R.o.value=d.o;R.t.value=d.t;R.i.value=d.i;}
  Object.keys(R).forEach(function(k){R[k].dispatchEvent(new Event("input",{bubbles:true}));});
});
rotiUpdate();

/* ============ FAKE-FACT HUNT ============ */
var huntDoc=$("#huntdoc"),huntFb=$("#hunt_fb");
huntDoc.addEventListener("click",function(e){
  var s=e.target.closest(".sus");if(!s||huntDoc.dataset.done)return;
  s.classList.toggle("flag");
});
function huntEvaluate(isRestore){
  if(huntDoc.dataset.done)return;
  huntDoc.dataset.done="1";
  var spans=$$(".sus",huntDoc),hits=0,bad=0,falseAlarm=0,html="",flagged=[];
  spans.forEach(function(s,n){
    var isBad=s.dataset.v==="bad",isFlag=s.classList.contains("flag");
    if(isFlag)flagged.push(n);
    s.classList.remove("flag");
    if(isBad){bad++;if(isFlag){hits++;s.classList.add("hit");}else{s.classList.add("shown");}}
    else if(isFlag){falseAlarm++;s.classList.add("miss");}
    var verdict=isBad?(isFlag?"🎯 You caught it! ":"😮 Missed. "):(s.dataset.v==="soft"?(isFlag?"👍 Good instinct. ":"Worth flagging too. "):(isFlag?"This one was actually fine. ":"✅ Correctly left alone. "));
    html+='<div class="'+(isBad?"bad":"fine")+'"><b>'+(n+1)+'. </b>'+verdict+esc(s.dataset.note)+'</div>';
  });
  huntFb.innerHTML=html;
  var st=$('.stamp[data-stamp="hunt"]');
  st.textContent=hits+" of "+bad+" fakes caught"+(falseAlarm?", "+falseAlarm+" false alarm"+(falseAlarm>1?"s":""):"")+(hits===bad?" 🌟":"");
  st.classList.add("on");
  if(hits<3){st.style.borderColor=st.style.color="#E23A2E";}
  if(!isRestore){
    rec("hunt_flags",modOf(huntDoc),"Sentences flagged in the fake-fact hunt",flagged);
    rec("hunt_score",modOf(huntDoc),"Fakes caught in the fake-fact hunt",hits+"/"+bad+" (false alarms: "+falseAlarm+")",hits);
  }
}
$("#hunt_check").addEventListener("click",function(){
  if(!huntDoc.dataset.done&&!$$(".sus.flag",huntDoc).length){
    huntFb.innerHTML='<div>👆 Tap the sentences you think are fake first. Then press the button.</div>';
    return;
  }
  huntEvaluate(false);
});
function restoreHunt(){
  var f=STATE.answers.hunt_flags;
  if(!f||!Array.isArray(f.a))return;
  var spans=$$(".sus",huntDoc);
  f.a.forEach(function(n){if(spans[n])spans[n].classList.add("flag");});
  huntEvaluate(true);
}
$("#hunt_reset").addEventListener("click",function(){
  delete huntDoc.dataset.done;huntFb.innerHTML="";
  var st=$('.stamp[data-stamp="hunt"]');st.classList.remove("on");st.style.borderColor=st.style.color="";
  $$(".sus",huntDoc).forEach(function(s){s.className="sus";});
  rec("hunt_flags",modOf(huntDoc),"Sentences flagged in the fake-fact hunt",null);
});

/* ============ TIMERS ============ */
$$(".timer").forEach(function(t){
  var total=parseInt(t.dataset.mins,10)*60,left=total,id=null;
  var view=t.querySelector(".tv"),btn=t.querySelector("button");
  function paint(){var m=Math.floor(left/60),s=left%60;view.textContent=m+":"+(s<10?"0":"")+s;}
  btn.addEventListener("click",function(){
    if(id){clearInterval(id);id=null;btn.textContent="Resume";return;}
    btn.textContent="Pause";t.classList.remove("done");
    id=setInterval(function(){
      left--;paint();
      if(left<=0){clearInterval(id);id=null;t.classList.add("done");view.textContent="Time!";btn.textContent="Reset";left=total;}
    },1000);
  });
  paint();
});

/* ============ COPY ============ */
function copyText(txt,btn){
  function done(){
    if(!btn)return;var old=btn.textContent;btn.textContent="Copied ✓";btn.classList.add("done");
    setTimeout(function(){btn.textContent=old;btn.classList.remove("done");},1600);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,function(){fallback(txt);done();});
  }else{fallback(txt);done();}
}
function fallback(txt){
  var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(err){}document.body.removeChild(ta);
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-copy]");if(!b)return;
  var box=b.parentNode.cloneNode(true);
  var inner=box.querySelector("[data-copy]");if(inner)inner.remove();
  copyText(box.textContent.trim(),b);
});

/* ============ RULES + DIARY ============ */
$('[data-fill="charter"]').addEventListener("click",function(e){
  var c=e.target.closest(".chip");if(!c)return;
  var inputs=$$(".charter-in");
  for(var i=0;i<inputs.length;i++){if(!inputs[i].value.trim()){inputs[i].value=c.textContent;inputs[i].dispatchEvent(new Event("input",{bubbles:true}));inputs[i].focus();return;}}
});
$("#charterCopy").addEventListener("click",function(e){
  var out="My AI rules\n\n"+$$(".charter-in").map(function(x,n){return (n+1)+". "+x.value;}).filter(function(l){return l.length>4;}).join("\n");
  copyText(out,e.target);
});
$("#diaryCopy").addEventListener("click",function(e){
  copyText("MY SAWAAL DIARY  (week of ______)\n\nDay 1\n1. What did I use AI for?\n2. What did I learn that I could explain tomorrow?\n3. What did AI get wrong, or what did I check?\n\nDay 2\n1.\n2.\n3.",e.target);
});

/* ============ FREE TEXT STORE ============ */
document.addEventListener("input",function(e){
  var el=e.target;if(!el.dataset||!el.dataset.store)return;
  var lab=el.id?document.querySelector('label[for="'+el.id+'"]'):null;
  var q=lab?lab.textContent.trim().slice(0,140):(el.previousElementSibling&&el.previousElementSibling.tagName==="LABEL"?el.previousElementSibling.textContent.trim():el.dataset.store);
  rec(el.dataset.store,modOf(el),q,el.value);
});

/* ============ EXPORT ============ */
function rows(){
  var out=[["participant_code","item_id","module","question","answer","correct","timestamp"]];
  Object.keys(STATE.answers).forEach(function(k){
    var a=STATE.answers[k];
    out.push([STATE.pid||"(no code)",k,a.mod,a.q,String(a.a==null?"":a.a),String(a.correct),a.t]);
  });
  return out;
}
function csv(){
  return rows().map(function(r){
    return r.map(function(c){return '"'+String(c).replace(/"/g,'""').replace(/\r?\n/g," / ")+'"';}).join(",");
  }).join("\n");
}
function updateExportSummary(){
  var el=$("#exportSummary");if(!el)return;
  var n=Object.keys(STATE.answers).length;
  var online=Sawaal.mode==="online"||Sawaal.mode==="offline";
  el.textContent=(STATE.pid?"Code name "+STATE.pid+". ":(online?"":"No code name yet. Go back to screen 2 if your teacher needs one. "))+n+" answers saved, including your check-ins, your roti, your ladder, your You vs AI answers and your activity scores."+(online?" They're already saved online. This download is your own copy.":"");
}
function download(name,text,type){
  try{
    var blob=new Blob([text],{type:type});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},500);
  }catch(err){showRaw();}
}
function showRaw(){var box=$("#rawBox");box.value=csv();box.classList.remove("hide");box.select();}
$("#dlCsv").addEventListener("click",function(){download(COURSE_FILE+"-"+(STATE.pid||"anon")+".csv","﻿"+csv(),"text/csv;charset=utf-8");});
$("#dlJson").addEventListener("click",function(){download(COURSE_FILE+"-"+(STATE.pid||"anon")+".json",JSON.stringify(STATE,null,2),"application/json");});
$("#showRaw").addEventListener("click",showRaw);

/* ============ RESUME: put saved answers back on screen ============ */
function restoreMeqUI(){
  $$(".meq").forEach(function(box){
    var id=box.dataset.item,ans=STATE.answers[id];
    if(!ans)return;
    var buttons=$$("button[data-val]",box);
    if(buttons.length){
      buttons.forEach(function(b){
        if(String(b.dataset.val)===String(ans.a))b.classList.add(b.parentNode.classList.contains("likert")?"on":"picked");
      });
    }else{
      var ta=box.querySelector("textarea");
      if(ta)ta.value=ans.a==null?"":ans.a;
    }
  });
  $$(".me").forEach(function(host){
    var saved=host.querySelector(".saved");
    if(saved&&host.querySelector(".meq .on,.meq .picked"))saved.classList.add("on");
  });
}
function restoreStoredFields(){
  $$("[data-store]").forEach(function(el){
    var ans=STATE.answers[el.dataset.store];
    if(ans&&ans.a!=null)el.value=ans.a;
  });
  Object.keys(R).forEach(function(k){grow(R[k]);});
  rotiUpdate();
  ladOwn.classList.toggle("hide",ladTopic.value!=="__own");
  if(STATE.answers.code_name&&!pid.value){pid.value=STATE.answers.code_name.a||"";STATE.pid=pid.value;}
}

/* ============ PLATFORM: open, restore, resume ============ */
function applyMode(state){
  var online=state.mode==="online"||state.mode==="offline";
  if(online&&state.student){
    STATE.pid=state.student.code;
    pid.value=state.student.code;
    pid.classList.add("hide");
    var lab=pid.parentNode.querySelector('label[for="pid"]');if(lab)lab.classList.add("hide");
    var hint=pid.parentNode.querySelector("p.small");if(hint)hint.classList.add("hide");
    $("#pidTitle").textContent="Your secret key 🔑";
    var ps=$("#pidSigned");ps.textContent=state.student.code;ps.classList.remove("hide");
    $("#saveNote").textContent="Saved online as you go. You can stop and carry on later, on any phone or computer.";
    $("#exportLead").textContent="Your answers are already saved online, so there's nothing to hand in. If you'd like your own copy, download it here.";
    $("#exportNote").classList.add("hide");
    $("#doneSaved").classList.remove("hide");
    $("#doneBack").classList.remove("hide");
  }
  if(state.mode==="local"){
    $("#saveNote").textContent="You're not signed in, so answers stay on this device only. Open the menu (☰) and choose Sign in to save.";
  }
}

slides[0].classList.add("on");
show(0);
updateExportSummary();

Sawaal.start().then(function(state){
  RESTORING=true;
  try{
    Object.keys(state.answers).forEach(function(k){STATE.answers[k]=state.answers[k];});
    applyMode(state);
    restoreMeqUI();
    restoreStoredFields();
    restoreActivitiesUI();
    restoreHunt();
    updateExportSummary();
  }finally{RESTORING=false;}
  show(state.completed?0:(state.screen||0));  /* finished students start from the top to reread */
  READY=true;
});

window.addEventListener("beforeunload",function(e){
  if(Sawaal.mode==="local"&&Object.keys(STATE.answers).length>3){e.preventDefault();e.returnValue="";}
});
})();
</script>
